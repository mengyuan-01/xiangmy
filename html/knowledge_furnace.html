<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识炼炉</title>
    <script src="lib/sweetalert2.all.min.js"></script>
    <style>
        /* ===== 全部样式保留 ===== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f5f6fa;
            color: #1a1a2e;
        }

        @media (max-width: 900px) {
            .tobu { padding: 0 10px; gap: 8px; }
            .tobu > div a { font-size: 12px !important; padding: 5px 8px !important; }
        }
        @media (max-width: 560px) {
            .tobu > div a { font-size: 0 !important; padding: 5px 6px !important; }
        }
        
        .tobu {
            height: 52px;
            background: #fff;
            border-bottom: 1px solid #eaeaea;
            display: flex;
            align-items: center;
            padding: 0 18px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            gap: 14px;
        }
        
        .logo {
            font-size: 18px;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: 2px;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .logo::before {
            content: "🔥";
            font-size: 16px;
        }
        
        .toggle-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: all .2s;
        }
        
        .toggle-btn:hover {
            background: #eee;
        }
        
        .toggle-btn span {
            display: block;
            width: 14px;
            height: 2px;
            background: #444;
            border-radius: 1px;
            transition: all .3s;
        }
        
        .toggle-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
        }
        
        .toggle-btn.active span:nth-child(2) {
            opacity: 0;
        }
        
        .toggle-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }
        
        .main-container {
            display: flex;
            height: calc(100vh - 52px);
            margin-top: 52px;
        }
        
        .zuoche {
            width: 240px;
            background: #fff;
            border-right: 1px solid #eaeaea;
            transition: width .3s ease, opacity .3s ease;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        .zuoche.hidden {
            width: 0;
            opacity: 0;
            border-right: none;
        }
        
        .sidebar-header {
            padding: 14px 18px 8px;
            font-size: 11px;
            color: #aaa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        
        .project-list {
            list-style: none;
            padding: 4px 10px;
            flex: 1;
            overflow-y: auto;
        }

            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #555;
            transition: all .15s;
            position: relative;
            margin-bottom: 2px;
        }
        
        .project-item:hover {
            background: #f5f6fa;
        }
        
        .project-item.active {
            background: #f0f4ff;
            color: #4a6cf7;
        }
        
        .project-item.active .project-menu {
            opacity: 1;
        }
        
        .project-item:hover .project-menu {
            opacity: 1;
        }
        
        .project-icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }
        
        .project-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .project-count {
            font-size: 11px;
            color: #bbb;
            font-weight: 500;
        }
        
        .project-item.active .project-count {
            color: #8aa0ff;
        }
        
        .project-menu {
            opacity: 0;

            height: 26px;
            border: none;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #999;
            transition: all .2s;
        }
        
        .project-menu:hover {
            background: rgba(0, 0, 0, 0.05);

        }

            color: #fff;

            gap: 6px;

            flex-shrink: 0;

            border-radius: 10px;

        }

        }
        
        .dropdown-item.delete:hover {

            overflow-y: auto;

        }

            margin: 0 auto;

            visibility: hidden;

            backdrop-filter: blur(4px);
        }
        
        .modal-overlay.show {

<script>
/* __FILE_FETCH_BRIDGE__ : file:// 打开时把 /api 请求转到本地应用服务，保证数据同步 */
(function () {
  if (location.protocol !== 'file:') return;
  var origFetch = window.fetch ? window.fetch.bind(window) : null;
  if (!origFetch) return;
  var BASE = null;
  var ready = new Promise(function (resolve) {
    var ports = [5000, 5001, 5002, 5003, 5004];
    var i = 0;
    (function next() {
      if (i >= ports.length) { resolve(null); return; }
      var p = ports[i++];
      origFetch('http://127.0.0.1:' + p + '/api/health', { cache: 'no-store' })
        .then(function (r) { resolve(r.ok ? 'http://127.0.0.1:' + p : null); })
        .catch(function () { next(); });
    })();
  });
  window.fetch = function (input, init) {
    if (typeof input === 'string' && input.charAt(0) === '/') {
      return ready.then(function (base) {
        return origFetch((base || 'http://127.0.0.1:5000') + input, init);
      });
    }
    return origFetch(input, init);
  };
})();
</script>

    <script>
        // ================================================================
        // 1. 数据验证
        // ================================================================
        function validateProjects(data) {
            if (!Array.isArray(data)) {
                console.warn('❌ 数据不是数组');
                return {
                    valid: false,
                    data: [],
                    error: '数据不是数组'
                };
            }
            let fixedCount = 0,
                skippedCount = 0;
            const valid = [];
            for (let i = 0; i < data.length; i++) {
                const p = data[i];
                if (!p || typeof p !== 'object') {
                    skippedCount++;
                    continue;
                }
                if (typeof p.id !== 'number') {
                    const parsed = parseInt(p.id);
                    p.id = !isNaN(parsed) ? parsed : Date.now() + i;
                    fixedCount++;
                }
                if (typeof p.name !== 'string') {
                    p.name = p.name == null ? '未命名项目' : String(p.name);
                    fixedCount++;
                }
                if (!p.questions || typeof p.questions !== 'object') {
                    p.questions = {};
                    fixedCount++;
                }
                if (!Array.isArray(p.questions.list)) p.questions.list = [];
                if (typeof p.questions.currentIndex !== 'number') p.questions.currentIndex = 0;
                valid.push(p);
            }
            if (fixedCount > 0 || skippedCount > 0) {
                console.log('🔧 validateProjects: 补齐 ' + fixedCount + ' 个字段，跳过 ' + skippedCount + ' 个无效项目');
            }
            return {
                valid: true,
                data: valid,
                count: valid.length,
                error: null
            };
        }

        // ================================================================
        // 2. 数据持久化
        // ================================================================
        async function persistProjects() {
            try {
                localStorage.setItem('knowledge_furnace_projects', JSON.stringify(projects));
                localStorage.setItem('knowledge_furnace_projects_backup', JSON.stringify(projects));
            } catch (e) {}

            try {
                const response = await fetch('/api/projects', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(projects)
                });
                if (response.ok) {
                    const result = await response.json();
                    console.log('✅ 项目已保存到后端 (' + (result.count || projects.length) + ' 个)');
                }
            } catch (e) {
                console.warn('⚠️ 保存到后端异常', e);
            }
        }

        async function loadProjectsFromDisk() {
            try {
                const response = await fetch('/api/projects');
                if (!response.ok) return {
                    success: false
                };
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    const validated = validateProjects(data);
                    if (validated.valid && validated.count > 0) {
                        try {
                            localStorage.setItem('knowledge_furnace_projects', JSON.stringify(validated.data));
                        } catch (e) {}
                        return {
                            success: true,
                            data: validated.data,
                            count: validated.count
                        };
                    }
                }
                return {
                    success: false
                };
            } catch (e) {
                return {
                    success: false
                };
            }
        }

        function loadProjectsFromStorage() {
            const keys = ['knowledge_furnace_projects', 'knowledge_furnace_projects_backup'];
            for (const key of keys) {
                try {
                    const stored = localStorage.getItem(key);
                    if (!stored) continue;
                    const data = JSON.parse(stored);
                    if (!Array.isArray(data) || data.length === 0) continue;
                    const validated = validateProjects(data);
                    if (validated.valid && validated.count > 0) {
                        return {
                            success: true,
                            data: validated.data,
                            count: validated.count
                        };
                    }
                } catch (e) {}
            }
            return {
                success: false
            };
        }

        // ================================================================
        // 3. 笔记列表加载
        // ================================================================
        async function loadNotesList() {
            let notes = [];
            try {
                const response = await fetch('/api/notes');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        notes = data.filter(n => n.status === 'normal');
                        console.log('📥 从后端加载笔记，共 ' + notes.length + ' 篇');
                        try {
                            localStorage.setItem('deep_learning_notes_v2', JSON.stringify(notes));
                        } catch (e) {}
                        return notes;
                    }
                }
            } catch (e) {
                console.warn('从后端加载笔记失败', e);
            }
            try {
                const stored = localStorage.getItem('deep_learning_notes_v2') || localStorage.getItem('pure_notes_blog3');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    if (Array.isArray(parsed)) {
                        notes = parsed.filter(n => n.status === 'normal');
                        console.log('📥 从 localStorage 加载笔记，共 ' + notes.length + ' 篇');
                        return notes;
                    }
                }
            } catch (e) {
                console.warn('从 localStorage 加载笔记失败', e);
            }
            return notes;
        }

        function renderNoteSelectList(notes) {
            const container = document.getElementById('noteSelectList');
            if (!notes || notes.length === 0) {
                container.innerHTML = '<div class="note-select-empty">📭 暂无笔记，请先在笔记页面创建</div>';
                return;
            }
            let html = '';
            notes.forEach(note => {
                const title = note.title || '无标题';
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = note.content || '';
                const plainPreview = (tempDiv.innerText || '').slice(0, 60);
                const isSelected = (selectedNoteId !== null && String(note.id) === String(selectedNoteId));
                html += `
                    <div class="note-select-item ${isSelected ? 'selected' : ''}" data-note-id="${note.id}">
                        <input type="radio" name="noteSelect" class="note-check" value="${note.id}" ${isSelected ? 'checked' : ''}>
                        <div class="note-info">
                            <div class="note-title">${escapeHtml(title)}</div>
                            <div class="note-preview">${escapeHtml(plainPreview)}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.note-select-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.tagName === 'INPUT') return;
                    const radio = this.querySelector('.note-check');
                    if (radio) {
                        radio.checked = true;
                        const event = new Event('change');
                        radio.dispatchEvent(event);
                    }
                });
                const radio = el.querySelector('.note-check');
                if (radio) {
                    radio.addEventListener('change', function() {
                        container.querySelectorAll('.note-select-item').forEach(item => item.classList.remove('selected'));
                        el.classList.add('selected');
                        selectedNoteId = this.value;
                    });
                }
            });

            if (notes.length > 0 && selectedNoteId === null) {
                const firstRadio = container.querySelector('.note-check');
                if (firstRadio) {
                    firstRadio.checked = true;
                    firstRadio.dispatchEvent(new Event('change'));
                    selectedNoteId = firstRadio.value;
                }
            }
        }

        function openNoteSelectModal() {
            selectedNoteId = null;
            document.getElementById('noteSelectList').innerHTML = '<div class="note-select-empty">加载中...</div>';
            document.getElementById('noteSelectModal').classList.add('show');

            loadNotesList().then(notes => {
                allNotes = notes;
                renderNoteSelectList(notes);
                const confirmBtn = document.getElementById('confirmNoteSelectBtn');
                confirmBtn.disabled = (notes.length === 0);
                confirmBtn.style.opacity = (notes.length === 0) ? '0.5' : '1';
            });
        }

        function closeNoteSelectModal() {
            document.getElementById('noteSelectModal').classList.remove('show');
        }

        function selectNoteForAutoCreate() {
            openNoteSelectModal();
        }

        // ================================================================
        // 4. 自动出题（含等待弹窗）
        // ================================================================
        async function confirmNoteSelect() {
            if (selectedNoteId === null) {
                showToast('请先选择一篇笔记');
                return;
            }
            const note = allNotes.find(n => n && String(n.id) === String(selectedNoteId) || (n && String(n.filename) === String(selectedNoteId)));
            if (!note) {
                showToast('笔记不存在');
                return;
            }

            closeNoteSelectModal();

            // ========== 显示等待弹窗 ==========
            Swal.fire({
                title: '⏳ 正在生成题目',
                text: 'AI 正在努力出题，请稍候...（约 1-2 分钟）',
                allowOutsideClick: false,
                allowEscapeKey: false,
                showConfirmButton: false,
                willOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const confirmBtn = document.getElementById('confirmNoteSelectBtn');
                confirmBtn.textContent = '⏳ 生成中...';
                confirmBtn.disabled = true;

                const response = await fetch('/api/generate_questions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filename: note.filename
                    })
                });

                Swal.close();

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || '生成失败');
                }

                const result = await response.json();

                if (result.success) {
                    // 清空临时题目
                    tempQuestions = {
                        choice: [],
                        multi: [],
                        fill: [],
                        dictation: [],
                        reading: []
                    };
                    const types = ['choice', 'multi', 'fill', 'dictation', 'reading'];
                    types.forEach(type => {
                        tempQuestions[type] = result.questions[type] || [];
                    });
                    renderPreviewList();
                    const stats = types.map(t => `${t}: ${tempQuestions[t].length}`).join('、');
                    showToast(`✅ 生成完成：${stats}`);
                } else {
                    showToast('⚠️ 生成失败：' + (result.error || '未知错误'));
                }

            } catch (err) {
                Swal.close();
                console.error('生成题目出错:', err);
                showToast('❌ 生成题目出错：' + err.message);
            } finally {
                const confirmBtn = document.getElementById('confirmNoteSelectBtn');
                confirmBtn.textContent = '确定生成';
                confirmBtn.disabled = false;
            }
        }

        // ================================================================
        // 5. 项目列表渲染
        // ================================================================
        function renderProjectList() {
            const list = document.getElementById('projectList');
            list.innerHTML = '';
            projects.forEach(p => {
                const li = document.createElement('li');
                li.className = 'project-item' + (p.id === currentProjectId ? ' active' : '');
                li.innerHTML = `
                    <span class="project-icon">📁</span>
                    <span class="project-name">${escapeHtml(p.name)}</span>
                    <span class="project-count">${getQCount(p)}</span>
                    <button class="project-menu" onclick="event.stopPropagation();toggleProjectMenu(${p.id},this)">⋮</button>
                    <div class="dropdown-menu" id="menu-${p.id}">
                        <div class="dropdown-item" onclick="event.stopPropagation();startRename(${p.id})"><span>✏️</span> 重命名</div>
                        <div class="dropdown-item delete" onclick="event.stopPropagation();deleteProject(${p.id})"><span>🗑️</span> 删除</div>
                    </div>
                `;
                li.onclick = () => selectProject(p.id);
                list.appendChild(li);
            });
        }

        function getQCount(p) {
            let c = 0;
            const qs = (p && p.questions) || {};
            for (let k in qs) {
                const v = qs[k];
                if (Array.isArray(v)) c += v.length;
                else if (typeof v === 'number') c += v;
            }
            return c;
        }

        function toggleProjectMenu(id, btn) {
            document.querySelectorAll('.dropdown-menu').forEach(m => {
                if (m.id !== 'menu-' + id) m.classList.remove('show');
            });
            document.getElementById('menu-' + id).classList.toggle('show');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        });

        // ================================================================
        // 6. 创建项目
        // ================================================================
        function switchCreateMode(btn) {
            createMode = btn.dataset.mode;
            document.querySelectorAll('.create-mode-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('manualArea').style.display = createMode === 'manual' ? 'block' : 'none';
            document.getElementById('autoArea').style.display = createMode === 'auto' ? 'block' : 'none';
        }

        function openCreateProjectModal() {
            tempQuestions = {
                choice: [],
                multi: [],
                fill: [],
                dictation: [],
                reading: []
            };
            document.getElementById('projectNameInput').value = '';
            document.getElementById('previewCount').textContent = '(0)';
            createMode = 'manual';
            document.querySelectorAll('.create-mode-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.create-mode-tab[data-mode="manual"]').classList.add('active');

            document.getElementById('autoArea').style.display = 'none';
            renderPreviewList();
            switchQType(document.querySelector('.type-tab[data-type="choice"]'));
            document.getElementById('createProjectModal').classList.add('show');
            setTimeout(() => document.getElementById('projectNameInput').focus(), 100);
        }

        function closeCreateModal() {
            document.getElementById('createProjectModal').classList.remove('show');
            tempQuestions = {
                choice: [],
                multi: [],
                fill: [],
                dictation: [],
                reading: []
            };
        }

        async function createProject() {
            const name = document.getElementById('projectNameInput').value.trim();
            if (!name) {
                showToast('请输入项目名称');
                return;
            }

            const totalQ = getQCount({
                questions: tempQuestions
            });
            if (totalQ === 0) {
                showToast('请至少添加一道题目');
                return;
            }

            const project = {
                id: Date.now(),
                name: name,
                questions: JSON.parse(JSON.stringify(tempQuestions)),
                createdAt: new Date().toLocaleString()
            };
            projects.push(project);
            await persistProjects();
            closeCreateModal();
            renderProjectList();
            selectProject(project.id);
        }

        // ================================================================
        // 7. 预览列表
        // ================================================================
        function renderPreviewList() {
            const container = document.getElementById('previewList');
            let all = [];
            const tags = {
                choice: '选择',
                multi: '多选',
                fill: '填空',
                dictation: '默写',
                reading: '阅读'
            };
            const tagClasses = {
                choice: 'tag-choice',
                multi: 'tag-multi',
                fill: 'tag-fill',
                dictation: 'tag-dictation',
                reading: 'tag-reading'
            };

            for (let type in tempQuestions) {
                tempQuestions[type].forEach((q, idx) => {
                    let text = '';
                    if (type === 'choice' || type === 'multi') text = q.question;
                    else if (type === 'fill') text = q.question;
                    else if (type === 'dictation') text = q.title;
                    else if (type === 'reading') text = q.passage.substring(0, 30) + '...';
                    all.push({
                        type,
                        idx,
                        text,
                        tag: tags[type],
                        tagClass: tagClasses[type]
                    });
                });
            }

            document.getElementById('previewCount').textContent = `(${all.length})`;

            if (all.length === 0) {
                container.innerHTML = '<div class="preview-empty">还没有添加题目</div>';
                return;
            }

            container.innerHTML = all.map(item => `
                <div class="preview-item">
                    <span class="preview-tag ${item.tagClass}">${item.tag}</span>
                    <span class="preview-text">${escapeHtml(item.text)}</span>
                    <button class="preview-del" onclick="removeTempQuestion('${item.type}',${item.idx})">✕</button>
                </div>
            `).join('');
        }

        function removeTempQuestion(type, idx) {
            tempQuestions[type].splice(idx, 1);
            renderPreviewList();
        }

        function addTempQuestion() {
            if (currentQType === 'choice') {
                const text = document.getElementById('qText').value.trim();
                if (!text) {
                    showToast('请输入题目');
                    return;
                }
                const rows = document.querySelectorAll('#choiceOptions .option-row');
                const opts = [];
                let correctIdx = -1;
                rows.forEach((r, i) => {
                    const v = r.querySelector('input[type="text"]').value.trim();
                    if (v) opts.push(v);
                    const radio = r.querySelector('input[type="radio"]');
                    if (radio && radio.checked) correctIdx = i;
                });
                if (opts.length < 2) {
                    showToast('请至少填写2个选项');
                    return;
                }
                if (correctIdx === -1) {
                    showToast('请选择一个正确答案');
                    return;
                }
                tempQuestions.choice.push({
                    question: text,
                    options: opts,
                    answer: String.fromCharCode(65 + correctIdx)
                });
            } else if (currentQType === 'multi') {
                const text = document.getElementById('qText').value.trim();
                if (!text) {
                    showToast('请输入题目');
                    return;
                }
                const rows = document.querySelectorAll('#multiOptions .option-row');
                const opts = [];
                let correctIndices = [];
                rows.forEach((r, i) => {
                    const v = r.querySelector('input[type="text"]').value.trim();
                    if (v) opts.push(v);
                    const cb = r.querySelector('input[type="checkbox"]');
                    if (cb && cb.checked) correctIndices.push(i);
                });
                if (opts.length < 2) {
                    showToast('请至少填写2个选项');
                    return;
                }
                if (correctIndices.length === 0) {
                    showToast('请至少选择一个正确答案');
                    return;
                }
                const answer = correctIndices.map(i => String.fromCharCode(65 + i)).join('');
                tempQuestions.multi.push({
                    question: text,
                    options: opts,
                    answer: answer
                });
            } else if (currentQType === 'fill') {
                const text = document.getElementById('qText').value.trim();
                if (!text) {
                    showToast('请输入题目');
                    return;
                }
                if (!text.includes('_____')) {
                    showToast('题目中需要包含 _____ 表示填空位置');
                    return;
                }
                const ans = document.getElementById('qAnswer').value.trim();
                if (!ans) {
                    showToast('请填写参考答案');
                    return;
                }
                tempQuestions.fill.push({
                    question: text,
                    answer: ans
                });
            } else if (currentQType === 'dictation') {
                const title = document.getElementById('qTitle').value.trim();
                if (!title) {
                    showToast('请输入默写标题');
                    return;
                }
                const hint = document.getElementById('qHint').value.trim();
                tempQuestions.dictation.push({
                    title: title,
                    hint: hint
                });
            } else if (currentQType === 'reading') {
                const passage = document.getElementById('qPassage').value.trim();
                if (!passage) {
                    showToast('请输入阅读文章');
                    return;
                }
                const count = parseInt(document.getElementById('qCount').value);
                const questions = [];
                for (let i = 0; i < count; i++) {
                    const t = document.getElementById(`rqText${i}`).value.trim();
                    if (!t) {
                        showToast(`请填写题目 ${i+1}`);
                        return;
                    }
                    questions.push({
                        question: t
                    });
                }
                tempQuestions.reading.push({
                    passage: passage,
                    questions: questions
                });
            }

            renderPreviewList();
            renderQuestionForm(currentQType);
        }

        // 渲染题目（不显示答案，留出 answer-display 容器）
        function renderQuestions(type, qList) {
            let html = '';
            qList.forEach((q, idx) => {
                        html += `<div class="question-card" id="q-${type}-${idx}">`;
                        html += `<button class="q-delete" onclick="deleteQuestion('${type}',${idx})">✕</button>`;

                        if (type === 'choice') {
                            html += `<div class="q-text"><span class="q-num">${idx+1}</span><span>${escapeHtml(q.question)}</span></div>`;
                            html += `<div class="options">`;
                            q.options.forEach((opt, oi) => {
                                const val = String.fromCharCode(65 + oi);
                                html += `<label class="option" onclick="selectOption(this)"><input type="radio" name="c${idx}" value="${val}"><span>${(() => { const t = escapeHtml(opt); return /^[A-Fa-f][.、:：)）]/.test(t.trim()) ? t : val + '. ' + t; })()}</span></label>`;
                            });
                            html += `</div>`;
                        } else if (type === 'multi') {
                            html += `<div class="q-text"><span class="q-num">${idx+1}</span><span>${escapeHtml(q.question)}</span></div>`;
                            html += `<div class="options">`;
                            q.options.forEach((opt, oi) => {
                                const val = String.fromCharCode(65 + oi);
                                html += `<label class="option" onclick="toggleOption(this)"><input type="checkbox" name="m${idx}" value="${val}"><span>${(() => { const t = escapeHtml(opt); return /^[A-Fa-f][.、:：)）]/.test(t.trim()) ? t : val + '. ' + t; })()}</span></label>`;
                            });
                            html += `</div>`;
                        } else if (type === 'fill') {
                            const parts = q.question.split('_____');
                            let qHtml = parts.map((part, pi) => {
                                if (pi === parts.length - 1) return escapeHtml(part);
                                return escapeHtml(part) + '<input type="text" class="blank-input" placeholder="填写答案">';
                            }).join('');
                            html += `<div class="q-text"><span class="q-num">${idx+1}</span><span>${qHtml}</span></div>`;
                        } else if (type === 'dictation') {
                            html += `<div class="q-text"><span class="q-num">${idx+1}</span><div style="flex:1;"><div style="font-weight:600;margin-bottom:4px;">${escapeHtml(q.title)}</div>${q.hint ? `<div style="font-size:13px;color:#999;">${escapeHtml(q.hint)}</div>` : ''}</div></div>`;
                    html += `<div style="padding-left:34px;"><textarea class="text-area" rows="3" placeholder="在此默写..."></textarea></div>`;
                } else if (type === 'reading') {
                    html += `<div class="reading-passage">${escapeHtml(q.passage)}</div>`;
                    q.questions.forEach((rq, ri) => {
                        html += `<div class="reading-question">`;
                        html += `<div class="q-text" style="margin-bottom:8px;"><span class="q-num">${ri+1}</span><span>${escapeHtml(rq.question)}</span></div>`;
                        html += `<textarea class="text-area" rows="3" placeholder="在此作答..."></textarea>`;
                        html += `</div>`;
                    });
                }
                // 答案显示容器（初始隐藏）
                html += `<div class="answer-display" id="ans-${type}-${idx}"></div>`;
                html += `</div>`;
            });
            return html;
        }

        // ================================================================
        // 10. 提交答案（显示正误与正确答案）
        // ================================================================
        function submitAnswers() {
            const p = projects.find(x => x.id === currentProjectId);
            if (!p) { showToast('请先选择项目'); return; }

            // 先隐藏所有之前的答案显示
            document.querySelectorAll('.answer-display').forEach(el => {
                el.style.display = 'none';
                el.className = 'answer-display';
            });

            let total = 0,
                correct = 0;
            const details = [];

            const typeKeys = ['choice', 'multi', 'fill', 'dictation', 'reading'];
            for (const type of typeKeys) {
                const qList = p.questions[type] || [];
                qList.forEach((q, idx) => {
                    const cardId = `q-${type}-${idx}`;
                    const answerDisplay = document.getElementById(`ans-${type}-${idx}`);
                    if (!answerDisplay) return;

                    total++;
                    let isCorrect = false;
                    let userAnswer = '';
                    let correctAnswer = '';

                    if (type === 'choice') {
                        const radios = document.querySelectorAll(`#${cardId} input[name="c${idx}"]`);
                        let selected = '';
                        radios.forEach(r => { if (r.checked) selected = r.value; });
                        userAnswer = selected || '未选';
                        correctAnswer = q.answer || '';
                        isCorrect = (selected === correctAnswer);
                    } else if (type === 'multi') {
                        const cbs = document.querySelectorAll(`#${cardId} input[name="m${idx}"]`);
                        let selected = [];
                        cbs.forEach(cb => { if (cb.checked) selected.push(cb.value); });
                        userAnswer = selected.join('') || '未选';
                        correctAnswer = q.answer || '';
                        // 比较时都排序
                        const userSorted = selected.slice().sort().join('');
                        const expectedSorted = correctAnswer.split('').sort().join('');
                        isCorrect = (userSorted === expectedSorted);
                    } else if (type === 'fill') {
                        const inputs = document.querySelectorAll(`#${cardId} .blank-input`);
                        let answers = [];
                        inputs.forEach(inp => answers.push(inp.value.trim()));
                        userAnswer = answers.join(' / ') || '未填';
                        correctAnswer = q.answer || '';
                        const expectedParts = correctAnswer.split(',').map(s => s.trim());
                        if (answers.length === expectedParts.length) {
                            isCorrect = answers.every((a, i) => a === expectedParts[i]);
                        } else {
                            isCorrect = false;
                        }
                    } else {
                        // 默写、阅读暂不自动批改，跳过
                        return;
                    }

                    if (isCorrect) correct++;

                    // 显示答案
                    answerDisplay.style.display = 'block';
                    answerDisplay.className = 'answer-display ' + (isCorrect ? 'correct' : 'wrong');
                    answerDisplay.innerHTML = `
                        ${isCorrect ? '✅ 正确' : '❌ 错误'} &nbsp;|&nbsp; 你的答案：${escapeHtml(userAnswer)} &nbsp;|&nbsp; 正确答案：${escapeHtml(correctAnswer)}
                    `;

                    details.push({ type, idx, userAnswer, correctAnswer, isCorrect });
                });
            }

            // 弹窗统计
            let msg = `总题数：${total}，正确：${correct}，正确率：${total > 0 ? Math.round(correct/total*100) : 0}%\n\n`;
            details.forEach(d => {
                const icon = d.isCorrect ? '✅' : '❌';
                msg += `${icon} 第${d.idx+1}题（${d.type}）：你的答案 ${d.userAnswer} ${d.isCorrect ? '正确' : '错误'}\n`;
            });
            Swal.fire({
                title: '📊 答题结果',
                text: msg,
                icon: correct === total ? 'success' : 'info',
                confirmButtonText: '确定',
                width: 600,
            });
        }

            selectProject(currentProjectId);

        async function deleteProject(id) {
            showConfirmDanger('删除项目', '确定要删除这个项目吗？所有题目将一并删除。', async function() {
                try {
                    localStorage.setItem('knowledge_furnace_projects_before_delete', JSON.stringify(projects));
                } catch (e) {}

                // 优先走后端单条删除接口；接口不可用再退回全量覆盖
                let removedOnServer = false;
                try {
                    const resp = await fetch('/api/projects/' + encodeURIComponent(id), { method: 'DELETE' });
                    const payload = await resp.json().catch(function() { return {}; });
                    removedOnServer = resp.ok && payload.ok !== false;
                } catch (e) {
                    console.warn('删除项目接口异常，改走全量覆盖', e);
                }

                projects = projects.filter(p => p.id !== id);
                if (!removedOnServer) await persistProjects();
                renderProjectList();
                if (currentProjectId === id) {
                    currentProjectId = null;
                    document.getElementById('contentInner').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📚</div>
                            <h3>暂无项目</h3>
                            <p>点击左侧「新建项目」开始创建</p>
                        </div>
                    `;
                }
            }, '删除');
        }

        async function exportProject() {
            const p = projects.find(x => x.id === currentProjectId);
            if (!p) { showToast('请先选择一个项目'); return; }
            const data = JSON.stringify(p, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const filename = `${p.name}.json`;

            let saved = false;
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: filename,
                        types: [{ description: 'JSON 文件', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showToast('✅ 导出成功');
                    saved = true;
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                    console.warn('保存对话框不可用，改用浏览器下载：', err && err.message);
                }
            }
            if (!saved) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1500);
                showToast('✅ 导出成功');
            }
        }

        async function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.name || !data.questions) { showToast('文件格式不正确'); return; }
                    data.id = Date.now();
                    projects.push(data);
                    persistProjects();
                    renderProjectList();
                    selectProject(data.id);
                    showToast('✅ 导入成功！');
                } catch (err) { showToast('文件解析失败'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ================================================================
        // 12. 通用工具
        // ================================================================
        function selectOption(el) {
            el.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input').checked = true;
        }

        function toggleOption(el) {
            el.classList.toggle('selected');
            const cb = el.querySelector('input[type="checkbox"]');
            cb.checked = !cb.checked;
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function showToast(msg) {
            const el = document.getElementById('toastNotice');
            if (!el) return;
            el.innerText = msg;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 2500);
        }

        function showConfirm(title, message, onConfirm, okText, cancelText) {
            document.getElementById('confirmTitle').innerText = title || '确认';
            document.getElementById('confirmMessage').innerText = message || '';
            const okBtn = document.getElementById('confirmOkBtn');
            okBtn.innerText = okText || '确定';
            okBtn.classList.remove('danger');
            okBtn.classList.add('ok');
            document.getElementById('confirmCancelBtn').innerText = cancelText || '取消';
            okBtn.onclick = function() {
                closeConfirmModal();
                if (onConfirm) onConfirm();
            };
            document.getElementById('confirmModal').classList.add('show');
        }

        function showConfirmDanger(title, message, onConfirm, okText, cancelText) {
            showConfirm(title, message, onConfirm, okText, cancelText);
            const okBtn = document.getElementById('confirmOkBtn');
            okBtn.classList.remove('ok');
            okBtn.classList.add('danger');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        // ================================================================
        // 13. 侧边栏切换
        // ================================================================
        document.getElementById('toggleBtn').addEventListener('click', function() {
            document.getElementById('zuoche').classList.toggle('hidden');
            this.classList.toggle('active');
        });

        document.querySelectorAll('.modal-overlay').forEach(o => {
            o.addEventListener('click', e => {
                if (e.target === o) {
                    if (o.id === 'createProjectModal') closeCreateModal();
                    else if (o.id === 'noteSelectModal') closeNoteSelectModal();
                    else o.classList.remove('show');
                }
            });
        });

        document.getElementById('projectNameInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') document.getElementById('qText')?.focus();
        });
        document.getElementById('renameInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') confirmRename();
        });

        // ================================================================
        // 14. 数据变量
        // ================================================================
        let projects = [];
        let currentProjectId = null;
        let editingProjectId = null;
        let tempQuestions = { choice: [], multi: [], fill: [], dictation: [], reading: [] };
        let currentQType = 'choice';
        let createMode = 'manual';
        let optionCount = 2;
        let readingQCount = 3;
        let allNotes = [];
        let selectedNoteId = null;

        // ================================================================
        // 15. 初始化
        // ================================================================
        async function init() {
            const diskResult = await loadProjectsFromDisk();
            if (diskResult.success && diskResult.count > 0) {
                projects = diskResult.data;
                currentProjectId = projects[0].id;
                renderProjectList();
                selectProject(currentProjectId);
                console.log('✅ 知识炼炉数据已从后端加载');
                return;
            }

            const storageResult = loadProjectsFromStorage();
            if (storageResult.success && storageResult.count > 0) {
                projects = storageResult.data;
                currentProjectId = projects[0].id;
                await persistProjects();
                renderProjectList();
                selectProject(currentProjectId);
                console.log('✅ 从 localStorage 恢复知识炼炉数据，已同步到后端');
                return;
            }

            projects = [];
            currentProjectId = null;
            renderProjectList();
            document.getElementById('contentInner').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <h3>暂无项目</h3>
                    <p>点击左侧「新建项目」开始创建</p>
                </div>
            `;
            console.log('📝 知识炼炉数据将保存在 data/cjiushuj/timu/cjiuh/projects.json');
        }

        window.addEventListener('beforeunload', function() {
            try {
                localStorage.setItem('knowledge_furnace_projects', JSON.stringify(projects));
                localStorage.setItem('knowledge_furnace_projects_backup', JSON.stringify(projects));
            } catch (e) {}
        });

        init();
    </script>
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box" style="width: 420px;">
            <div class="modal-header">
                <div class="modal-title" id="confirmTitle">确认</div>
                <button class="modal-close" onclick="closeConfirmModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="confirm-message" id="confirmMessage"></div>
            </div>
            <div class="modal-footer">
                <button class="btn cancel" id="confirmCancelBtn" onclick="closeConfirmModal()">取消</button>
                <button class="btn ok" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>
    <div id="toastNotice" class="toast-notice"></div>
</body>

</html>
