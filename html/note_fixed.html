<script>
/* __FILE_FETCH_BRIDGE__ : file:// 打开时把 /api 请求转到本地应用服务，保证数据同步 */
(function () {
  if (location.protocol !== 'file:') return;
  var origFetch = window.fetch ? window.fetch.bind(window) : null;
  if (!origFetch) return;
  var BASE = null;
  var ready = new Promise(function (resolve) {
    var ports = [5000, 5001, 5002, 5003, 5004];
    var i = 0;
    (function next() {
      if (i >= ports.length) { resolve(null); return; }
      var p = ports[i++];
      origFetch('http://127.0.0.1:' + p + '/api/health', { cache: 'no-store' })
        .then(function (r) { resolve(r.ok ? 'http://127.0.0.1:' + p : null); })
        .catch(function () { next(); });
    })();
  });
  window.fetch = function (input, init) {
    if (typeof input === 'string' && input.charAt(0) === '/') {
      return ready.then(function (base) {
        return origFetch((base || 'http://127.0.0.1:5000') + input, init);
      });
    }
    return origFetch(input, init);
  };
})();
</script>

<script>
console.log('📄 [note_fixed] 脚本开始执行');

// ================================================================
// 本地 UI 状态
// ================================================================
const UI = {
    get(key, defaultValue) { try { const v = localStorage.getItem(key); return v === null ? defaultValue : v; } catch (e) { return defaultValue; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
};

const PREF = {
    sidebarCollapsed: UI.get('note_sidebar_collapsed', '0') === '1',
    previewMode: UI.get('note_preview_mode', '0') === '1'
};

// ================================================================
// 数据层
// ================================================================
const db = {
    isPyWebview() { return !!(window.pywebview && window.pywebview.api); },
    isFileProtocol() { return location.protocol === 'file:'; },

    async loadNotes(status) {
        const st = status || 'normal';
        if (this.isPyWebview()) {
            try {
                const r = await window.pywebview.api.load_notes();
                return Array.isArray(r) ? r : [];
            } catch (e) { console.error('❌ db.loadNotes 失败:', e); return []; }
        }
        try {
            const url = st === 'archived' ? '/api/notes?status=archived' : '/api/notes';
            const r = await fetch(url);
            return await r.json();
        } catch (e) { return []; }
    },

    async loadNoteContent(filename) {
        if (this.isPyWebview()) {
            try { const r = await window.pywebview.api.load_note_content(filename); return (r && r.content) || ''; }
            catch (e) { return ''; }
        }
        try { const r = await fetch(`/api/notes/${encodeURIComponent(filename)}`); const d = await r.json(); return d.content || ''; } catch (e) { return ''; }
    },

    async createNote(title, content) {
        if (this.isPyWebview()) {
            try { return await window.pywebview.api.create_note(title, content || ''); }
            catch (e) { return { ok: false, error: String(e) }; }
        }
        try { const r = await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, content }) }); return await r.json(); } catch (e) { return { ok: false, error: String(e) }; }
    },

    async updateNote(filename, title, content, remark) {
        if (this.isPyWebview()) {
            try { return await window.pywebview.api.update_note(filename, title, content, remark); }
            catch (e) { return { ok: false, error: String(e) }; }
        }
        try { const r = await fetch(`/api/notes/${encodeURIComponent(filename)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, content, remark }) }); return await r.json(); } catch (e) { return { ok: false, error: String(e) }; }
    },

    async deleteNote(filename) {
        if (this.isPyWebview()) {
            try { return await window.pywebview.api.delete_note(filename); }
            catch (e) { return { ok: false, error: String(e) }; }
        }
        try { const r = await fetch(`/api/notes/${encodeURIComponent(filename)}`, { method: 'DELETE' }); return await r.json(); } catch (e) { return { ok: false, error: String(e) }; }
    },

    async archiveNote(filename) {
        if (this.isPyWebview()) {
            try { return await window.pywebview.api.archive_note(filename); }
            catch (e) { return { ok: false, error: String(e) }; }
        }
        try { const r = await fetch(`/api/notes/archive/${encodeURIComponent(filename)}`, { method: 'POST' }); return await r.json(); } catch (e) { return { ok: false, error: String(e) }; }
    }
};

// ================================================================
// 全局状态
// ================================================================
let notes = [];
let currentNoteId = null;
let searchKeyword = "";
let saveTimer = null;
let showingArchived = false;

let _savingPromise = null;
let _pendingSave = false;
let _lastSavedContent = '';
let _lastSavedTitle = '';
let _lastSavedFilename = '';
let _lastBqCount = -1;

let isPreviewMode = PREF.previewMode;

const titleInput = document.getElementById('noteTitle');
const previewContent = document.getElementById('previewContent');
const previewTitle = document.getElementById('previewTitle');
const toastEl = document.getElementById('toast');
const autoSaveStatus = document.getElementById('autoSaveStatus');
const saveDot = document.getElementById('saveDot');

// 【弹窗焦点】与批注弹窗同款策略：只聚焦弹窗内输入框，绝不操作 Quill 的
// contenteditable/disable/focus。在 pywebview(WebKitGTK) 下，对"已聚焦"的
// 编辑器执行 disable / 改 contenteditable 会把焦点卡死在编辑器上，导致
// 之后 input.focus() 全部失效（批注弹窗从不碰 Quill，所以一直正常）。
let _modalFocusTimer = null;      // 弹窗打开后的首次聚焦定时器
let _modalFocusRetryTimer = null; // 首次聚焦后的复核补焦定时器

// ================================================================
// 工具
// ================================================================
function getNow() { return new Date().toLocaleString('zh-CN'); }

function getLocalDateTimeString() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function stripHtml(html) {
    const div = document.createElement('div');
    div.innerHTML = html || '';
    return (div.textContent || '').replace(/\s+/g, ' ').trim();
}

function formatTime(ts) {
    if (!ts) return '';
    let d;
    const s = String(ts);
    if (/[zZ]$/.test(s) || /[+-]\d{2}:?\d{2}$/.test(s)) {
        d = new Date(s);
    } else {
        d = new Date(s.replace(' ', 'T'));
    }
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' 天前';
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function setSaveState(state) {
    saveDot.classList.remove('unsaved', 'saving');
    if (state === 'unsaved') { saveDot.classList.add('unsaved'); saveDot.title = '未保存'; }
    else if (state === 'saving') { saveDot.classList.add('saving'); saveDot.title = '保存中...'; }
    else { saveDot.title = '已保存'; }
}

async function waitForBackend(maxMs = 3000) {
    if (db.isPyWebview()) return true;
    const start = Date.now();
    while (Date.now() - start < maxMs) {
        if (db.isPyWebview()) return true;
        // 浏览器以 file:// 直接打开时，后端走本地 HTTP 服务（由页面内接口桥转发）
        try {
            const r = await fetch('/api/health', { cache: 'no-store' });
            if (r && r.ok) return true;
        } catch (e) {}
        await new Promise(r => setTimeout(r, 400));
    }
    return db.isPyWebview();
}

async function askConfirm(opts) {
    try {
        if (typeof Swal !== 'undefined' && Swal && typeof Swal.fire === 'function') {
            return await Swal.fire({
                title: opts.title || '确认',
                text: opts.text || '',
                icon: opts.icon || 'question',
                showCancelButton: true,
                confirmButtonText: opts.confirmButtonText || '确定',
                cancelButtonText: opts.cancelButtonText || '取消',
                confirmButtonColor: opts.confirmButtonColor || '#409eff',
                cancelButtonColor: opts.cancelButtonColor || '#909399'
            });
        }
    } catch (e) { console.warn('Swal 失败'); }
    const text = (opts.title ? opts.title + '\n\n' : '') + (opts.text || '');
    return { isConfirmed: window.confirm(text) };
}

// ================================================================
// Quill 初始化
// ================================================================
function fatalError(msg) {
    const div = document.createElement('div');
    div.className = 'fatal-error';
    div.innerHTML = '<b>⚠️ 页面初始化失败</b><br>' + msg;
    document.body.appendChild(div);
}

if (window.__libLoadErrors && window.__libLoadErrors.length > 0) {
    fatalError('以下库文件加载失败：<b>' + window.__libLoadErrors.join('、') + '</b>');
    throw new Error('第三方库加载失败: ' + window.__libLoadErrors.join(','));
}
if (typeof Quill === 'undefined') { fatalError('Quill 未加载成功'); throw new Error('Quill is not defined'); }
if (Quill.version && !Quill.version.startsWith('1.')) {
    fatalError('<b>lib/quill.js</b> 版本不兼容：需要 Quill 1.3.7，当前 ' + Quill.version);
    throw new Error('Quill 版本不兼容: ' + Quill.version);
}
if (typeof hljs === 'undefined') { fatalError('highlight.js 未加载成功'); throw new Error('hljs is not defined'); }

console.log('📝 初始化 Quill...');
let quill;
try {
    const SizeStyle = Quill.import('attributors/style/size');
    SizeStyle.whitelist = ['12px', '14px', '16px', '18px', '20px', '24px', '28px'];
    Quill.register(SizeStyle, true);

    quill = new Quill('#quillEditor', {
        theme: 'snow',
        placeholder: '开始书写...',
        modules: {
            toolbar: false,
            syntax: { highlight: (text) => hljs.highlightAuto(text).value },
            history: { delay: 500, maxStack: 200, userOnly: true }
        }
    });
    window.quill = quill;
} catch (e) {
    fatalError('编辑器初始化失败：<b>' + e.message + '</b>');
    throw e;
}
console.log('✅ Quill 已创建');

// ============================================================
// blockquote 装饰
// ============================================================
function decorateBlockquotes(force = false) {
    const editorBlocks = quill.root.querySelectorAll('blockquote');
    const previewBlocks = previewContent ? previewContent.querySelectorAll('blockquote') : [];
    const total = editorBlocks.length + previewBlocks.length;
    if (!force && total === _lastBqCount && total === 0) return;
    _lastBqCount = total;

    const applyDecor = (bq, list) => {
        bq.classList.remove('ql-bq-first', 'ql-bq-last');
        const idx = Array.prototype.indexOf.call(list, bq);
        const prev = list[idx - 1];
        const next = list[idx + 1];
        const prevIsBq = prev && prev.tagName === 'BLOCKQUOTE';
        const nextIsBq = next && next.tagName === 'BLOCKQUOTE';
        if (!prevIsBq) bq.classList.add('ql-bq-first');
        if (!nextIsBq) bq.classList.add('ql-bq-last');
    };

    editorBlocks.forEach(bq => {
        const siblings = bq.parentElement ? bq.parentElement.querySelectorAll(':scope > blockquote') : [bq];
        applyDecor(bq, siblings);
    });
    previewBlocks.forEach(bq => {
        const siblings = bq.parentElement ? bq.parentElement.querySelectorAll(':scope > blockquote') : [bq];
        applyDecor(bq, siblings);
    });
}

// ============================================================
// 引用块 / 代码块：连续两次回车退出
// ============================================================
function setupBlockExitOnDoubleEnter(quill) {
    const INTERVAL = 300;
    let lastEnterTime = 0;
    let lastBlockType = null;

    function detectBlockType() {
        try {
            const range = quill.getSelection();
            if (range) {
                const fmt = quill.getFormat(range.index);
                if (fmt && fmt['code-block']) return 'code-block';
                if (fmt && fmt['blockquote']) return 'blockquote';
            }
        } catch (e) {}
        try {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                let node = sel.anchorNode;
                while (node && node !== quill.root) {
                    if (node.nodeType === 1) {
                        const tag = node.tagName;
                        if (tag === 'PRE') return 'code-block';
                        if (tag === 'BLOCKQUOTE') return 'blockquote';
                    }
                    node = node.parentNode;
                }
            }
        } catch (e) {}
        return null;
    }

    function exitBlock(blockType) {
        quill.format(blockType, false, Quill.sources.USER);
        setTimeout(() => {
            if (typeof updateToolbarState === 'function') updateToolbarState();
            decorateBlockquotes(true);
        }, 0);
    }

    quill.root.addEventListener('keydown', function(e) {
        const isEnter = (e.key === 'Enter' || e.keyCode === 13 || e.which === 13);
        if (!isEnter) return;
        if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        if (e.isComposing) return;

        const blockType = detectBlockType();
        if (!blockType) { lastEnterTime = 0; lastBlockType = null; return; }

        const now = Date.now();
        const isDouble = (lastBlockType === blockType) && ((now - lastEnterTime) < INTERVAL);

        if (isDouble) {
            e.preventDefault();
            e.stopImmediatePropagation();
            e.stopPropagation();
            exitBlock(blockType);
            lastEnterTime = 0;
            lastBlockType = null;
            return;
        }

        lastEnterTime = now;
        lastBlockType = blockType;
    }, true);
}

setupBlockExitOnDoubleEnter(quill);

function bindToolbar() {
    document.querySelectorAll('.editor-toolbar .tool-btn').forEach(btn => {
        btn.addEventListener('mousedown', (e) => e.preventDefault());
    });

    function fmt(name, value) {
        quill.focus();
        const cur = quill.getFormat();
        if (typeof value === 'boolean') quill.format(name, cur[name] ? false : value);
        else quill.format(name, value);
    }
    document.getElementById('btnBold').addEventListener('click', () => fmt('bold', true));
    document.getElementById('btnItalic').addEventListener('click', () => fmt('italic', true));
    document.getElementById('btnUnderline').addEventListener('click', () => fmt('underline', true));
    document.getElementById('btnStrike').addEventListener('click', () => fmt('strike', true));
    // ---- 行级格式（对齐 / 列表 / 引用）：只作用于光标所在的那一行 ----
    // 之前直接用 quill.format() 时，如果选区覆盖了多行甚至整篇，会把整篇一起改掉；
    // 这里统一用 formatLine 锁定「当前段落」，即使整篇被选中也只改光标所在那一行。
    function currentLineInfo() {
        const sel = quill.getSelection(true) || { index: 0, length: 0 };
        let idx = sel.index;
        const max = Math.max(0, quill.getLength() - 2);
        if (idx > max) idx = max;
        const line = quill.getLine(idx)[0];
        const lineIndex = quill.getIndex(line);
        return { index: lineIndex, format: quill.getFormat(lineIndex, 1) };
    }
    function fmtLine(name, value) {
        quill.focus();
        const L = currentLineInfo();
        quill.formatLine(L.index, 1, name, value, 'user');
    }
    document.getElementById('btnAlignLeft').addEventListener('click', () => fmtLine('align', false));
    document.getElementById('btnAlignCenter').addEventListener('click', () => fmtLine('align', 'center'));
    document.getElementById('btnAlignRight').addEventListener('click', () => fmtLine('align', 'right'));
    document.getElementById('btnBullet').addEventListener('click', () => { const L = currentLineInfo(); fmtLine('list', L.format.list === 'bullet' ? false : 'bullet'); });
    document.getElementById('btnOrdered').addEventListener('click', () => { const L = currentLineInfo(); fmtLine('list', L.format.list === 'ordered' ? false : 'ordered'); });
    document.getElementById('btnBlockquote').addEventListener('click', () => { const L = currentLineInfo(); fmtLine('blockquote', !L.format.blockquote); });
    document.getElementById('btnCodeBlock').addEventListener('click', () => {
        // 同样只作用于光标所在这一行，不受整篇选区影响
        const L = currentLineInfo();
        fmtLine('code-block', !L.format['code-block']);
    });
    document.getElementById('btnLink').addEventListener('click', async () => {
        const range = quill.getSelection(true);
        if (!range) return;
        const cur = quill.getFormat().link || '';
        let url = null;
        if (typeof Swal !== 'undefined' && Swal && typeof Swal.fire === 'function') {
            const res = await Swal.fire({
                title: '插入链接',
                input: 'url',
                inputValue: cur,
                inputPlaceholder: 'https://example.com',
                showCancelButton: true,
                confirmButtonText: '确定',
                cancelButtonText: '取消',
                confirmButtonColor: '#409eff',
                cancelButtonColor: '#909399'
            });
            if (!res.isConfirmed) return;
            url = (res.value || '').trim();
        } else {
            url = prompt('输入链接地址:', cur);
            if (url === null) return;
            url = url.trim();
        }
        quill.setSelection(range.index, range.length || 0);
        if (url === '') quill.format('link', false);
        else quill.format('link', url);
    });
    document.getElementById('btnImage').addEventListener('click', () => {
        const input = document.getElementById('noteImageInput');
        if (input) input.click();
    });
    // 图片 input 在 script 之后，这里用事件委托，避免绑定时机早于元素解析
    document.addEventListener('change', (e) => {
        const t = e.target;
        if (!t || t.id !== 'noteImageInput') return;
        const file = t.files && t.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            const range = quill.getSelection(true) || { index: quill.getLength() };
            quill.insertEmbed(range.index, 'image', reader.result);
            quill.setSelection(range.index + 1);
        };
        reader.readAsDataURL(file);
        t.value = '';
    });
    document.getElementById('btnClean').addEventListener('click', () => {
        quill.focus();
        const range = quill.getSelection(true);
        if (!range || range.length === 0) {
            ['bold','italic','underline','strike','blockquote','code-block','link','size','align','list'].forEach(f => quill.format(f, false));
        } else {
            quill.removeFormat(range.index, range.length);
        }
    });
    document.getElementById('fontSizeSelect').addEventListener('change', (e) => {
        quill.focus();
        if (e.target.value) quill.format('size', e.target.value);
        else quill.format('size', false);
    });
}

function updateToolbarState() {
    if (isPreviewMode) return;
    const f = quill.getFormat();
    document.getElementById('btnBold').classList.toggle('active', !!f.bold);
    document.getElementById('btnItalic').classList.toggle('active', !!f.italic);
    document.getElementById('btnUnderline').classList.toggle('active', !!f.underline);
    document.getElementById('btnStrike').classList.toggle('active', !!f.strike);
    document.getElementById('btnBlockquote').classList.toggle('active', !!f.blockquote);
    document.getElementById('btnCodeBlock').classList.toggle('active', !!f['code-block']);
    document.getElementById('btnBullet').classList.toggle('active', f.list === 'bullet');
    document.getElementById('btnOrdered').classList.toggle('active', f.list === 'ordered');
    document.getElementById('btnAlignLeft').classList.toggle('active', !f.align || f.align === '' || f.align === false);
    document.getElementById('btnAlignCenter').classList.toggle('active', f.align === 'center');
    document.getElementById('btnAlignRight').classList.toggle('active', f.align === 'right');
    document.getElementById('fontSizeSelect').value = f.size || '';
}

quill.on('text-change', (delta, oldDelta, source) => {

function getDisplayNotes() {
    if (!searchKeyword.trim()) return notes;
    const kw = searchKeyword.trim().toLowerCase();
    return notes.filter(n =>
        (n.title || '').toLowerCase().includes(kw) ||
        (n.preview || '').toLowerCase().includes(kw)
    );
}

function renderList() {
    const container = document.getElementById('noteList');
    const displayNotes = getDisplayNotes();
    if (displayNotes.length === 0) {
        container.innerHTML = '<div class="note-empty">' + (notes.length === 0 ? '📝 暂无笔记' : '未找到匹配的笔记') + '</div>';
        document.getElementById('selectAll').checked = false;
        updateEmptyState();
        return;
    }
    let html = '';
    displayNotes.forEach(note => {
        const activeClass = (note.filename === currentNoteId) ? 'active' : '';
        const timeStr = formatTime(note.updated_at || note.updatedAt);
        const rawPreview = stripHtml(note.preview || '');
        const previewText = rawPreview ? rawPreview.slice(0, 60) : '空笔记';
        const remarkBadge = note.remark ? '<span class="note-remark-badge" title="有批注">📌</span>' : '';
        const restoreBtn = showingArchived
            ? `<span class="note-restore-btn" data-restore="${escapeHtml(note.filename)}" title="恢复这篇笔记">恢复</span>`
            : '';
        html += `<div class="note-item ${activeClass}" data-filename="${escapeHtml(note.filename)}">
            <input type="checkbox" class="note-check" data-check="${escapeHtml(note.filename)}">
            <div class="note-info">
                <div class="note-title">${escapeHtml(note.title || '无标题')}${remarkBadge}${restoreBtn}</div>
                <div class="note-preview">${escapeHtml(previewText)}</div>
                ${timeStr ? `<div class="note-time">${timeStr}</div>` : ''}
            </div>
        </div>`;
    });
    container.innerHTML = html;

    container.querySelectorAll('.note-item').forEach(el => {
        el.addEventListener('click', async (e) => {
            if (e.target.classList.contains('note-check')) return;
            const restoreEl = e.target.closest ? e.target.closest('.note-restore-btn') : null;
            if (restoreEl) {
                e.preventDefault();
                e.stopPropagation();
                await restoreNote(restoreEl.dataset.restore);
                return;
            }
            const filename = el.dataset.filename;
            if (filename === currentNoteId) return;
            await saveCurrentNote(true);
            await openNote(filename);
        });
    });
    container.querySelectorAll('.note-check').forEach(cb => {
        cb.addEventListener('change', syncSelectAll);
    });
    syncSelectAll();
    updateEmptyState();
}

function updateListItemInPlace(note) {
    if (!note) return;
    const container = document.getElementById('noteList');
    if (!container) return;
    const esc = (window.CSS && CSS.escape) ? CSS.escape(note.filename) : note.filename.replace(/["\\]/g, '\\$&');
    const item = container.querySelector(`.note-item[data-filename="${esc}"]`);
    if (!item) return;

    const titleEl = item.querySelector('.note-title');
    if (titleEl) {
        const remarkBadge = note.remark ? '<span class="note-remark-badge" title="有批注">📌</span>' : '';
        titleEl.innerHTML = escapeHtml(note.title || '无标题') + remarkBadge;
    }
    const previewEl = item.querySelector('.note-preview');
    if (previewEl) {
        const rawPreview = stripHtml(note.preview || '');
        previewEl.textContent = rawPreview ? rawPreview.slice(0, 60) : '空笔记';
    }
}

function updateEmptyState() {
    const emptyState = document.getElementById('emptyState');
    if (notes.length === 0 && !currentNoteId) emptyState.classList.add('visible');
    else emptyState.classList.remove('visible');
}

function syncSelectAll() {
    const all = document.querySelectorAll('.note-check');
    const checked = document.querySelectorAll('.note-check:checked');
    document.getElementById('selectAll').checked = all.length > 0 && all.length === checked.length;
}

function getSelectedFilenames() {

function scheduleSave() {

// ================================================================
// 保存
// ================================================================
function saveCurrentNote(immediate = false) {
    if (!currentNoteId) return Promise.resolve(false);

    const filenameToSave = currentNoteId;
    const content = quill.root.innerHTML;
    const title = titleInput.value || '未命名';

    if (filenameToSave === _lastSavedFilename &&
        content === _lastSavedContent &&
        title === _lastSavedTitle) {
        return Promise.resolve(true);
    }

    if (_savingPromise) {
        _pendingSave = true;
        if (immediate) return _savingPromise.then(() => saveCurrentNote(true));
        return _savingPromise;
    }

    const preview = stripHtml(content);
    setSaveState('saving');

    const note = notes.find(n => n.filename === filenameToSave);
    if (note) {
        note.title = title;
        note.preview = preview;
        note.updated_at = getLocalDateTimeString();
    }

    _savingPromise = (async () => {
        try {
            const r = await db.updateNote(filenameToSave, title, content, null);
            if (r && r.ok) {
                _lastSavedContent = content;
                _lastSavedTitle = title;
                _lastSavedFilename = filenameToSave;
                document.getElementById('updateTimeDisplay').innerText = getNow();
                markSaved();
                if (note) updateListItemInPlace(note);
                return true;
            } else {
                showToast('❌ 保存失败: ' + (r && r.error || '未知'));
                setSaveState('unsaved');
                return false;
            }
        } catch (err) {
            showToast('❌ 保存失败: ' + err.message);
            setSaveState('unsaved');
            return false;
        } finally {
            _savingPromise = null;
            if (_pendingSave) {
                _pendingSave = false;
                setTimeout(() => saveCurrentNote(false), 0);
            }
        }
    })();

    return _savingPromise;
}

// ================================================================
// 打开
// ================================================================
async function openNote(filename) {
    try {
        const content = await db.loadNoteContent(filename);
        const note = notes.find(n => n.filename === filename);
        if (!note) { showToast('❌ 笔记不存在'); return; }
        currentNoteId = filename;
        titleInput.value = note.title || '无标题';

        quill.setContents([], 'silent');
        // 用 convert + setContents 代替 dangerouslyPasteHTML：
        // dangerouslyPasteHTML 有已知的"抢焦点"行为（Quill 1.3.x issue #2097），
        // 会强制把 DOM 焦点放回编辑器，是弹窗输入框失焦的重要诱因。
        const delta = quill.clipboard.convert(content || '');
        quill.setContents(delta, 'silent');
        quill.history.clear();

        _lastSavedFilename = filename;
        _lastSavedContent = content || '';
        _lastSavedTitle = note.title || '无标题';
        _pendingSave = false;

        document.getElementById('updateTimeDisplay').innerText = getNow();
        updateWordCount();
        _lastBqCount = -1;
        decorateBlockquotes(true);
        if (isPreviewMode) updatePreview();
        renderList();
        document.title = (note.title || '无标题') + ' - 智能笔记';
        setSaveState('saved');
        autoSaveStatus.textContent = '💾 自动保存中...';
        autoSaveStatus.style.color = '#909399';
    } catch (err) {
        showToast('❌ 打开笔记失败: ' + err.message);
    }
}

async function loadNotesList() {
    try {
        const data = await db.loadNotes(showingArchived ? 'archived' : 'normal');
        notes = Array.isArray(data) ? data : [];
        notes.sort((a, b) => {
            const ta = new Date(String(a.updated_at || a.updatedAt || 0).replace(' ', 'T')).getTime() || 0;
            const tb = new Date(String(b.updated_at || b.updatedAt || 0).replace(' ', 'T')).getTime() || 0;
            return tb - ta;
        });
        renderList();
    } catch (err) {
        showToast('❌ 加载笔记失败: ' + err.message);
        notes = [];
        renderList();
    }
}

function openNewNoteModal() {
    const modal = document.getElementById('newNoteModal');
    const input = document.getElementById('newNoteTitleInput');
    const errorEl = document.getElementById('newNoteError');
    input.value = '';
    errorEl.textContent = '';

    // 先释放当前持有焦点的元素（Quill / 按钮等）的 DOM 焦点，
    // 避免 WebKitGTK 把焦点"钉"在旧元素上、吞掉后续 input.focus()。
    try {
        if (document.activeElement && document.activeElement !== document.body) {
            document.activeElement.blur();
        }
    } catch (e) {}

    modal.classList.add('active');

    // 与批注弹窗相同的 100ms 时机聚焦；若 300ms 后复核发现焦点没落上，再补一次。
    // 不做 quill.disable() / contentEditable=false / pointer-events 等任何
    // 对 Quill 的操作 —— 那正是第二次起焦点卡死的根源之一。
    _scheduleModalFocus(input);
}

// 弹窗打开后聚焦输入框：100ms 首次聚焦 + 300ms 复核补焦（均单次，非循环抢焦点）
function _scheduleModalFocus(el) {
    if (_modalFocusTimer) clearTimeout(_modalFocusTimer);
    if (_modalFocusRetryTimer) clearTimeout(_modalFocusRetryTimer);
    _modalFocusTimer = setTimeout(() => {
        _modalFocusTimer = null;
        try { el.focus({ preventScroll: true }); } catch (e) { try { el.focus(); } catch (e2) {} }
        _modalFocusRetryTimer = setTimeout(() => {
            _modalFocusRetryTimer = null;
            try {
                const m = document.getElementById('newNoteModal');
                if (m && m.classList.contains('active')) {
                    el.focus({ preventScroll: true });
                }
            } catch (e) {}
        }, 300);
    }, 100);
}

function closeNewNoteModal() {
    const modal = document.getElementById('newNoteModal');
    modal.classList.remove('active');

    // 取消尚未触发的聚焦/复核定时器
    if (_modalFocusTimer) { clearTimeout(_modalFocusTimer); _modalFocusTimer = null; }
    if (_modalFocusRetryTimer) { clearTimeout(_modalFocusRetryTimer); _modalFocusRetryTimer = null; }

    // 关闭后【不再自动 quill.focus()】：
    // 之前每次关弹窗都把焦点喂给编辑器，会让 WebKitGTK 的焦点状态"粘"在
    // Quill 上，下一次打开弹窗时它拒绝把焦点让给输入框（第二次起失效的直接诱因）。
    // 需要焦点自动回编辑器的话，点一下编辑区即可。
    // 若确认问题解决后仍想自动回焦，可改回守卫版（弹窗再次打开时自动取消）：
    //   if (window._quillRestoreTimer) clearTimeout(window._quillRestoreTimer);
    //   window._quillRestoreTimer = setTimeout(() => {
    //       window._quillRestoreTimer = null;
    //       try {
    //           if (document.querySelector('.modal-overlay.active')) return;
    //           quill.focus();
    //       } catch (e) {}
    //   }, 100);
}

// ================================================================
// 新建笔记 —— 主流程
// ================================================================
async function createNewNote() {
    console.log('🆕 触发新建笔记');

    // 注意：这里不再对 Quill 做任何 disable/blur/contenteditable 操作。
    // 弹窗打开时遮罩层（z-index:2000）会盖住整个编辑器，Quill 收不到任何
    // 点击/按键；全局快捷键也已在 keydown 里按弹窗状态拦截。
    // 对"已聚焦"的 Quill 做 disable 在 pywebview(WebKitGTK) 下会导致焦点
    // 卡死在编辑器上，之后弹窗输入框再也无法获得焦点。

    if (db.isFileProtocol() && !db.isPyWebview()) {
        const ready = await waitForBackend(3000);
        if (!ready) {
            showToast('❌ 后端未就绪，请稍后重试');
            return;
        }
    }

    // 先保存当前
    try { await saveCurrentNote(true); } catch (e) {}

    openNewNoteModal();
}

// 弹窗按钮事件：确认创建
async function confirmCreateNewNote() {
    const input = document.getElementById('newNoteTitleInput');
    const errorEl = document.getElementById('newNoteError');
    const title = input.value.trim();
    if (!title) {
        errorEl.textContent = '标题不能为空';
        try { input.focus(); } catch (e) {}
        return;
    }

    closeNewNoteModal();

    try {
        const result = await db.createNote(title, '');
        if (!result || !result.ok) {
            showToast('❌ 创建失败: ' + ((result && result.error) || '未知错误'));
            return;
        }
        if (!result.filename) {
            showToast('❌ 创建失败: 后端未返回文件名');
            return;
        }
        await loadNotesList();
        await openNote(result.filename);
        showToast('✅ 笔记已创建');
    } catch (err) {
        showToast('❌ 创建失败: ' + (err && err.message ? err.message : String(err)));
    }
}

// ================================================================
// 删除 / 归档
// ================================================================
async function restoreNote(filename) {
    if (!filename) return;
    try {
        const r = await fetch(`/api/notes/archive/${encodeURIComponent(filename)}`, { method: 'DELETE' });
        const data = await r.json();
        if (data && data.ok === false) {
            showToast('❌ 恢复失败: ' + (data.error || '未知错误'));
            return;
        }
        showToast('♻️ 已恢复到笔记列表');
        await loadNotesList();
    } catch (e) {
        showToast('❌ 恢复失败: ' + e.message);
    }
}

async function deleteNotes(filenames) {
    if (!filenames.length) return;
    if (db.isFileProtocol() && !db.isPyWebview()) {
        const ready = await waitForBackend(3000);
        if (!ready) { showToast('❌ 后端未就绪，请稍后重试'); return; }
    }
    try { await saveCurrentNote(true); } catch (e) {}

    const confirmed = await askConfirm({
        title: '确认删除',
        text: `确定要删除 ${filenames.length} 篇笔记吗？删除后无法恢复。`,
        icon: 'warning',
        confirmButtonColor: '#f56c6c',
        confirmButtonText: '删除',
        cancelButtonText: '取消'
    });
    if (!confirmed.isConfirmed) return;
    try {
        for (const f of filenames) await db.deleteNote(f);
        const needSwitch = currentNoteId && filenames.includes(currentNoteId);
        let nextFilename = null;
        if (needSwitch) {
            const idx = notes.findIndex(n => n.filename === currentNoteId);
            const remaining = notes.filter(n => !filenames.includes(n.filename));
            if (remaining.length > 0) nextFilename = remaining[Math.min(idx, remaining.length - 1)]?.filename;
            currentNoteId = null;
        }
        await loadNotesList();
        if (needSwitch) { if (nextFilename) await openNote(nextFilename); else clearEditor(); }
        showToast(`已删除 ${filenames.length} 篇笔记`);
    } catch (err) { showToast('❌ 删除失败: ' + err.message); }
}

function clearEditor() {

    _lastSavedFilename = '';
    _lastSavedContent = '';

async function exportNote(format) {
    if (!currentNoteId) { showToast('没有打开的笔记'); return; }
    await saveCurrentNote(true);
    const note = notes.find(n => n.filename === currentNoteId);
    const title = note?.title || '未命名';
    const contentHtml = quill.root.innerHTML;
    const plainText = quill.getText() || '';
    const safeTitle = title.replace(/[\\/:*?"<>|]/g, '_');
    let blob = null, filename = '';
    try {
        switch (format) {
            case 'pdf': {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = `<h1 style="font-size:26px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:12px;">${escapeHtml(title)}</h1>${contentHtml}`;
                tempDiv.style.padding = '40px';
                tempDiv.style.maxWidth = '800px';
                tempDiv.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                document.body.appendChild(tempDiv);
                blob = await html2pdf().set({ margin: 10, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } }).from(tempDiv).output('blob');
                document.body.removeChild(tempDiv);
                filename = `${safeTitle}.pdf`;
                break;
            }
            case 'word': {
                const wordHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(title)}</title><style>body{font-family:sans-serif;padding:40px;max-width:800px;margin:0 auto;line-height:1.8;}h1{color:#1a1a2e;border-bottom:1px solid #eee;padding-bottom:12px;}pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:6px;}code{background:#f5f7fa;padding:2px 5px;border-radius:4px;color:#dc2626;}blockquote{border-left:4px solid #409eff;padding:0.6em 1.1em;margin:1em 0;background:#f5f7fa;}</style></head><body><h1>${escapeHtml(title)}</h1>${contentHtml}</body></html>`;
                blob = new Blob([wordHtml], { type: 'application/msword' });
                filename = `${safeTitle}.doc`;
                break;
            }
            case 'html': {
                const htmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${escapeHtml(title)}</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:40px;max-width:820px;margin:0 auto;line-height:1.85;color:#303133;}h1{color:#1a1a2e;border-bottom:1px solid #eee;padding-bottom:12px;}pre{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:6px;}code{background:#f5f7fa;padding:2px 6px;border-radius:4px;color:#dc2626;}blockquote{border-left:4px solid #409eff;padding:0.6em 1.1em;margin:1em 0;background:#f5f7fa;border-radius:0 6px 6px 0;}img{max-width:100%;}</style></head><body><h1>${escapeHtml(title)}</h1>${contentHtml}</body></html>`;
                blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                filename = `${safeTitle}.html`;
                break;
            }
            case 'txt': {
                blob = new Blob([`标题：${title}\n更新时间：${getNow()}\n\n${plainText}`], { type: 'text/plain;charset=utf-8' });
                filename = `${safeTitle}.txt`;
                break;
            }
            default: return;
        }
        saveAs(blob, filename);
        showToast('✅ 导出成功');
    } catch (err) { showToast('❌ 导出失败: ' + err.message); }
}

function togglePreview() {
    if (currentNoteId) saveCurrentNote(true);
    isPreviewMode = !isPreviewMode;
    UI.set('note_preview_mode', isPreviewMode ? '1' : '0');
    const editorBody = document.getElementById('editorBody');
    const previewScroll = document.getElementById('previewScroll');
    const btnPreview = document.getElementById('btnPreview');
    if (isPreviewMode) {
        updatePreview();
        editorBody.classList.add('preview');
        previewScroll.classList.add('active');
        btnPreview.classList.add('active');
        btnPreview.querySelector('svg').innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
        editorBody.classList.remove('preview');
        previewScroll.classList.remove('active');
        btnPreview.classList.remove('active');
        btnPreview.querySelector('svg').innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        setTimeout(() => quill.focus(), 100);
    }
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const expandBtn = document.getElementById('sidebarExpandBtn');
    const btn = document.getElementById('btnToggleSidebar');
    sidebar.classList.toggle('collapsed');
    const isCollapsed = sidebar.classList.contains('collapsed');
    UI.set('note_sidebar_collapsed', isCollapsed ? '1' : '0');
    if (isCollapsed) { expandBtn.classList.add('visible'); btn.classList.remove('active'); }
    else { expandBtn.classList.remove('visible'); btn.classList.add('active'); }
}

function applyInitialUIState() {
    const sidebar = document.getElementById('sidebar');
    const expandBtn = document.getElementById('sidebarExpandBtn');
    const btn = document.getElementById('btnToggleSidebar');
    if (PREF.sidebarCollapsed) {
        sidebar.classList.add('collapsed');
        expandBtn.classList.add('visible');
        btn.classList.remove('active');
    } else {
        btn.classList.add('active');
    }
    if (isPreviewMode) {
        const editorBody = document.getElementById('editorBody');
        const previewScroll = document.getElementById('previewScroll');
        const btnPreview = document.getElementById('btnPreview');
        editorBody.classList.add('preview');
        previewScroll.classList.add('active');
        btnPreview.classList.add('active');
        btnPreview.querySelector('svg').innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    }
}

// ================================================================
// 静态事件绑定
// ================================================================
function bindStaticEvents() {
    bindToolbar();

    let titleTimer = null;
    titleInput.addEventListener('input', () => {
        clearTimeout(titleTimer);
        titleTimer = setTimeout(() => {
            const note = notes.find(n => n.filename === currentNoteId);
            if (note) {
                note.title = titleInput.value || '未命名';
                updateListItemInPlace(note);
            }
            if (isPreviewMode) updatePreview();
        }, 300);
        markUnsaved();
        scheduleSave();
        if (currentNoteId) document.title = (titleInput.value || '无标题') + ' - 智能笔记';
    });

    // 打开新建弹窗
    // 与工具栏按钮一致的 mousedown 保护：阻止"点击按钮"这个动作把焦点落到
    // 按钮上。否则 WebKitGTK 会在松开鼠标时用点击焦点覆盖我们的 input.focus()，
    // 表现为"按住鼠标才能输入、一松开焦点就被抢走"。
    ['btnNew', 'emptyStateNewBtn'].forEach(id => {
        const b = document.getElementById(id);
        if (b) b.addEventListener('mousedown', (e) => e.preventDefault());
    });
    document.getElementById('btnNew').addEventListener('click', createNewNote);
    document.getElementById('emptyStateNewBtn').addEventListener('click', createNewNote);

    // 新建弹窗内部按钮
    document.getElementById('confirmNewNoteBtn').addEventListener('click', confirmCreateNewNote);
    document.getElementById('cancelNewNoteBtn').addEventListener('click', closeNewNoteModal);
    document.getElementById('closeNewNoteBtn').addEventListener('click', closeNewNoteModal);
    document.getElementById('newNoteTitleInput').addEventListener('mousedown', (e) => {
        // 点击输入框时立即重申焦点，抵消 WebKitGTK 点击流程的焦点回抢
        setTimeout(() => { try { e.target.focus({ preventScroll: true }); } catch (err) {} }, 0);
    });
    document.getElementById('newNoteTitleInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmCreateNewNote(); }
        else if (e.key === 'Escape') { e.preventDefault(); closeNewNoteModal(); }
    });
    // 点击遮罩关闭
    document.getElementById('newNoteModal').addEventListener('mousedown', (e) => {
        if (e.target.id === 'newNoteModal') closeNewNoteModal();
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
        if (!currentNoteId) { showToast('请先新建或打开一篇笔记'); return; }
        const ok = await saveCurrentNote(true);
        if (ok) showToast('✅ 已保存');
    });
    document.getElementById('btnExport').addEventListener('click', () => {
        if (!currentNoteId) { showToast('没有打开的笔记'); return; }
        document.getElementById('exportModal').classList.add('active');
    });
    document.getElementById('btnRemark').addEventListener('click', () => {
        if (!currentNoteId) { showToast('请先打开一篇笔记'); return; }
        const note = notes.find(n => n.filename === currentNoteId);
        document.getElementById('remarkTextarea').value = note?.remark || '';
        document.getElementById('remarkModal').classList.add('active');
        setTimeout(() => document.getElementById('remarkTextarea').focus(), 100);
    });
    document.getElementById('btnPreview').addEventListener('click', togglePreview);
    document.getElementById('btnToggleSidebar').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarExpandBtn').addEventListener('click', toggleSidebar);

    document.getElementById('batchDelete').addEventListener('click', () => {
        const ids = getSelectedFilenames();
        if (!ids.length) { showToast('请先选择笔记'); return; }
        deleteNotes(ids);
    });
    document.getElementById('batchArchive').addEventListener('click', () => {
        const ids = getSelectedFilenames();
        if (!ids.length) { showToast('请先选择笔记'); return; }
        if (showingArchived) { showToast('归档箱里的笔记不能再次归档'); return; }
        archiveNotes(ids);
    });
    document.getElementById('toggleArchived').addEventListener('click', async () => {
        showingArchived = !showingArchived;
        const btn = document.getElementById('toggleArchived');
        btn.textContent = showingArchived ? '返回列表' : '归档箱';
        btn.style.background = showingArchived ? '#409eff' : '';
        btn.style.color = showingArchived ? '#fff' : '';
        document.getElementById('batchArchive').style.display = showingArchived ? 'none' : '';
        if (showingArchived && currentNoteId) { clearEditor(); }
        await loadNotesList();
    });
    document.getElementById('selectAll').addEventListener('change', (e) => {
        document.querySelectorAll('.note-check').forEach(cb => cb.checked = e.target.checked);
    });
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchKeyword = e.target.value;
        renderList();
    });

    document.getElementById('closeRemarkBtn').addEventListener('click', () => document.getElementById('remarkModal').classList.remove('active'));
    document.getElementById('cancelRemarkBtn').addEventListener('click', () => document.getElementById('remarkModal').classList.remove('active'));
    document.getElementById('saveRemarkBtn').addEventListener('click', async () => {
        if (!currentNoteId) return;
        const filenameToSave = currentNoteId;
        const remark = document.getElementById('remarkTextarea').value;
        const note = notes.find(n => n.filename === filenameToSave);
        if (note) note.remark = remark;
        const r = await db.updateNote(filenameToSave, null, null, remark);
        if (r && r.ok) {
            showToast('✅ 批注已保存');
            if (note) updateListItemInPlace(note);
        } else {
            showToast('❌ 批注保存失败');
        }
        document.getElementById('remarkModal').classList.remove('active');
    });

    document.getElementById('closeExportBtn').addEventListener('click', () => document.getElementById('exportModal').classList.remove('active'));
    document.getElementById('cancelExportBtn').addEventListener('click', () => document.getElementById('exportModal').classList.remove('active'));
    document.querySelectorAll('.export-option').forEach(opt => {
        opt.addEventListener('click', () => {
            document.getElementById('exportModal').classList.remove('active');
            exportNote(opt.dataset.format);
        });
    });

    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('remarkModal')) e.target.classList.remove('active');
        if (e.target === document.getElementById('exportModal')) e.target.classList.remove('active');
    });

    document.addEventListener('keydown', (e) => {
        // 弹窗打开时忽略全局快捷键
        if (document.getElementById('newNoteModal').classList.contains('active')) return;
        if (document.querySelector('.swal2-container')) return;

        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            if (!currentNoteId) { showToast('请先新建或打开一篇笔记'); return; }
            saveCurrentNote(true).then(ok => { if (ok) showToast('✅ 已保存'); });
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 'b') { e.preventDefault(); document.getElementById('btnBold').click(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'i') { e.preventDefault(); document.getElementById('btnItalic').click(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'u') { e.preventDefault(); document.getElementById('btnUnderline').click(); }
        if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault(); togglePreview(); }
    });
}

bindStaticEvents();

let _appInited = false;
async function loadAndInitData() {
    if (_appInited) return;
    _appInited = true;
    renderList();
    await loadNotesList();
    const urlParams = new URLSearchParams(window.location.search);
    const noteRef = urlParams.get('noteId') || urlParams.get('id');
    let targetFilename = null;
    if (noteRef) {
        // 思维导图页面传过来的是笔记的数据库 id（如 19），旧链接可能传文件名，两种都兼容
        const byFilename = notes.find(n => String(n.filename) === String(noteRef));
        const byId = notes.find(n => String(n.id) === String(noteRef));
        const target = byFilename || byId;
        if (target) targetFilename = target.filename;
        else showToast('未找到对应的笔记（可能已删除或已归档）');
    }
    if (!targetFilename && notes.length > 0) targetFilename = notes[0].filename;
    if (targetFilename) await openNote(targetFilename);
    else clearEditor();
    if (noteRef && targetFilename) {
        const item = document.querySelector(`#noteList .note-item[data-filename="${targetFilename}"]`);
        if (item && item.scrollIntoView) item.scrollIntoView({ block: 'center' });
    }
}

(async () => {
    renderList();
    await Promise.race([
        new Promise(resolve => {
            if (window.pywebview && window.pywebview.api) { resolve(true); return; }
            window.addEventListener('pywebviewready', () => resolve(true), { once: true });
        }),
        new Promise(resolve => setTimeout(() => resolve(false), 1500))
    ]);
    await loadAndInitData();
})();

window.addEventListener('pywebviewready', () => { loadAndInitData(); });

window.addEventListener('beforeunload', () => {
    if (currentNoteId && window.pywebview && window.pywebview.api) {
        try {
            const content = quill.root.innerHTML;
            const title = titleInput.value || '未命名';
            window.pywebview.api.update_note(currentNoteId, title, content, null);
        } catch (e) {}
    }
});
