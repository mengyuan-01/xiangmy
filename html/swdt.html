                    layout.subtreeHeight = Math.max(layout.height, totalHeight);
                    let currentY = -totalHeight / 2;
                    for (const child of childLayouts) {
                        const childHeight = child.subtreeHeight || child.height;
                        child.x = this.config.levelGap;
                        child.y = currentY + childHeight / 2;
                        currentY += childHeight + this.config.siblingGap;
                        layout.children.push(child);
                    }
                } else { layout.subtreeHeight = layout.height; }
                return layout;
            }

            _getOrigin(scale, offsetX, offsetY) {
                const rect = this.container.getBoundingClientRect();
                const lw = this._rootWidth || this.config.nodeWidth;
                return {
                    x: rect.width / 2 - (lw * scale) / 2 + offsetX,
                    y: rect.height / 2 + offsetY
                };
            }

            render() {
                const rect = this.container.getBoundingClientRect();
                this.svg.setAttribute('width', rect.width);
                this.svg.setAttribute('height', rect.height);
                while (this.svg.firstChild) this.svg.removeChild(this.svg.firstChild);
                this.layoutMap.clear();

                const layout = this.calculateLayout(this.data);
                this._rootWidth = layout.width;
                const centerX = rect.width / 2 - (layout.width * this.scale) / 2 + this.offsetX;
                const centerY = rect.height / 2 + this.offsetY;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${centerX}, ${centerY}) scale(${this.scale})`);
                this.svg.appendChild(g);
                this.drawNode(g, layout, 0, 0, true, centerX, centerY);
            }

            drawNode(parentGroup, layout, x, y, isRoot, baseX, baseY) {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('transform', `translate(${x}, ${y})`);
                parentGroup.appendChild(g);

                const absX = baseX + x * this.scale;
                const absY = baseY + y * this.scale;
                this.layoutMap.set(layout.id, { x: absX, y: absY, width: layout.width * this.scale, height: layout.height * this.scale, layout });

                for (const child of layout.children) {
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const startX = layout.width, startY = 0, endX = child.x, endY = child.y;
                    const cp1x = startX + (endX - startX) / 2, cp1y = startY;
                    const cp2x = startX + (endX - startX) / 2, cp2y = endY;
                    line.setAttribute('d', `M ${startX} ${startY} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${endX} ${endY}`);
                    line.setAttribute('stroke', this.config.strokeColor);
                    line.setAttribute('stroke-width', this.config.strokeWidth);
                    line.setAttribute('fill', 'none');
                    g.appendChild(line);
                    this.drawNode(g, child, child.x, child.y, false, baseX, baseY);
                }

                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', 0);
                rect.setAttribute('y', -layout.height / 2);
                rect.setAttribute('width', layout.width);
                rect.setAttribute('height', layout.height);
                rect.setAttribute('rx', this.config.cornerRadius);
                rect.setAttribute('ry', this.config.cornerRadius);
                rect.setAttribute('fill', isRoot ? this.config.rootColor : this.config.nodeColor);
                rect.setAttribute('stroke', isRoot ? this.config.rootColor : this.config.nodeBorderColor);
                rect.setAttribute('stroke-width', 1);
                rect.classList.add('node-rect');
                if (this.selectedNodeId === layout.id || this.selectedNodeIds.has(layout.id)) rect.classList.add('selected');
                rect.setAttribute('data-node-id', layout.id);
                g.appendChild(rect);

                const nodeData = layout.node;
                if (nodeData) {
                    if (nodeData.note || nodeData.link) {
                        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        badge.setAttribute('cx', layout.width - 6);
                        badge.setAttribute('cy', -layout.height / 2 + 6);
                        badge.setAttribute('r', 3);
                        badge.setAttribute('fill', '#67c23a');
                        g.appendChild(badge);
                    }
                    if (nodeData.relatedNotes && nodeData.relatedNotes.length > 0) {
                        const bookText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        bookText.setAttribute('x', layout.width - 10);
                        bookText.setAttribute('y', -layout.height / 2 + 10);
                        bookText.setAttribute('font-size', '10');
                        bookText.setAttribute('text-anchor', 'end');
                        bookText.textContent = '📚';
                        g.appendChild(bookText);
                    }
                }

                const textGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                const lines = layout.lines || [layout.text || ''];
                const lineHeight = layout.lineHeight || 20;
                const textTotalHeight = lines.length * lineHeight;
                const startTextY = -textTotalHeight / 2 + lineHeight / 2;
                lines.forEach((line, i) => {
                    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    tspan.setAttribute('x', layout.width / 2);
                    tspan.setAttribute('y', startTextY + i * lineHeight);
                    tspan.setAttribute('text-anchor', 'middle');
                    tspan.setAttribute('dominant-baseline', 'central');
                    tspan.setAttribute('fill', isRoot ? this.config.rootTextColor : this.config.textColor);
                    tspan.setAttribute('font-size', '14');
                    tspan.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif');
                    tspan.classList.add('node-text');
                    tspan.textContent = line;
                    textGroup.appendChild(tspan);
                });
                g.appendChild(textGroup);

                const hasTags = nodeData && nodeData.tags && nodeData.tags.length > 0;
                if (hasTags) {
                    const tagGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    const tagY = layout.height / 2 - layout.tagHeight / 2 - 2;
                    const tagGap = 4;
                    let totalTagWidth = 0;
                    const tagWidths = [];
                    nodeData.tags.forEach(tag => { const tw = Math.min((tag.length * 10) + 8, 50); tagWidths.push(tw); totalTagWidth += tw + tagGap; });
                    totalTagWidth -= tagGap;
                    let currentX = (layout.width - totalTagWidth) / 2;
                    nodeData.tags.forEach((tag, i) => {
                        const tw = tagWidths[i];
                        const tagRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        tagRect.setAttribute('x', currentX);
                        tagRect.setAttribute('y', tagY - 7);
                        tagRect.setAttribute('width', tw);
                        tagRect.setAttribute('height', 14);
                        tagRect.setAttribute('rx', 3);
                        tagRect.setAttribute('ry', 3);
                        tagRect.setAttribute('fill', '#ecf5ff');
                        tagRect.setAttribute('stroke', '#b3d8ff');
                        tagRect.setAttribute('stroke-width', 0.5);
                        tagGroup.appendChild(tagRect);
                        const tagText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        tagText.setAttribute('x', currentX + tw / 2);
                        tagText.setAttribute('y', tagY);
                        tagText.setAttribute('text-anchor', 'middle');
                        tagText.setAttribute('dominant-baseline', 'central');
                        tagText.setAttribute('fill', '#409eff');
                        tagText.setAttribute('font-size', '9');
                        tagText.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif');
                        tagText.textContent = tag.length > 4 ? tag.substring(0, 3) + '..' : tag;
                        tagGroup.appendChild(tagText);
                        currentX += tw + tagGap;
                    });
                    g.appendChild(tagGroup);
                }
            }

            selectNode(id, isCtrl = false) {
                if (isCtrl) {
                    if (this.selectedNodeIds.has(id)) {
                        this.selectedNodeIds.delete(id);
                        if (this.selectedNodeId === id) {
                            const remaining = Array.from(this.selectedNodeIds);
                            this.selectedNodeId = remaining.length > 0 ? remaining[remaining.length - 1] : null;
                        }
                    } else { this.selectedNodeIds.add(id); this.selectedNodeId = id; }
                    this.render();
                    if (this.selectedNodeId && window.propPanel) window.propPanel.showNode(this.selectedNodeId);
                    else if (!this.selectedNodeId && window.propPanel) window.propPanel.clear();

                    if (this.selectedNodeId) {
                        const rightSidebar = document.getElementById('sidebarRight');
                        const rightBtn = document.getElementById('btnRight');
                        if (!rightSidebar.classList.contains('open')) {
                            rightSidebar.classList.add('open');
                            rightBtn.classList.add('active');
                            checkOverlay();
                            setTimeout(() => this.render(), 350);
                        }
                    }
                } else {
                    this.selectedNodeIds.clear();
                    this.selectedNodeId = id;
                    this.selectedNodeIds.add(id);
                    this.render();
                    if (window.propPanel) window.propPanel.showNode(id);

                    const rightSidebar = document.getElementById('sidebarRight');
                    const rightBtn = document.getElementById('btnRight');
                    if (!rightSidebar.classList.contains('open')) {
                        rightSidebar.classList.add('open');
                        rightBtn.classList.add('active');
                        checkOverlay();
                        setTimeout(() => this.render(), 350);
                    }
                }
            }

            deselectNode() {
                this.selectedNodeId = null;
                this.selectedNodeIds.clear();
                this.render();
                if (window.propPanel) window.propPanel.clear();
            }

            addChildNode() {
                if (!this.selectedNodeId) { this.showHint('请先选择一个节点'); return; }
                const result = this.findNode(this.selectedNodeId);
                if (!result) return;
                const newNode = { id: this.generateId(), text: '新节点' };
                if (!result.node.children) result.node.children = [];
                result.node.children.push(newNode);
                this.saveHistory();
                this.selectedNodeIds.clear();
                this.selectedNodeId = newNode.id;
                this.selectedNodeIds.add(newNode.id);
                this.render();
                window.mindmapManager.saveCurrentData();
                if (window.propPanel) window.propPanel.showNode(newNode.id, { skipLoadNotes: true });
                this.showHint('已添加子节点');
            }

            addSiblingNode() {
                if (!this.selectedNodeId) { this.showHint('请先选择一个节点'); return; }
                const result = this.findNode(this.selectedNodeId);
                if (!result) return;
                if (!result.parent) { this.showHint('根节点不能添加兄弟节点'); return; }
                const newNode = { id: this.generateId(), text: '新节点' };
                if (!result.parent.children) result.parent.children = [];
                result.parent.children.push(newNode);
                this.saveHistory();
                this.selectedNodeIds.clear();
                this.selectedNodeId = newNode.id;
                this.selectedNodeIds.add(newNode.id);
                this.render();
                window.mindmapManager.saveCurrentData();
                if (window.propPanel) window.propPanel.showNode(newNode.id, { skipLoadNotes: true });
                this.showHint('已添加兄弟节点');
            }

            deleteNode() {
                if (!this.selectedNodeId && this.selectedNodeIds.size === 0) { this.showHint('请先选择一个节点'); return; }
                const toDelete = Array.from(this.selectedNodeIds).filter(id => {
                    const r = this.findNode(id);
                    return r && r.parent;
                });
                if (toDelete.length === 0) { this.showHint('不能删除根节点'); return; }
                let deletedCount = 0;
                for (const id of toDelete) {
                    const result = this.findNode(id);
                    if (result && result.parent && result.parent.children) {
                        const index = result.parent.children.findIndex(n => n.id === id);
                        if (index > -1) { result.parent.children.splice(index, 1); deletedCount++; }
                    }
                }
                this.selectedNodeId = null;
                this.selectedNodeIds.clear();
                this.render();
                this.saveHistory();
                window.mindmapManager.saveCurrentData();
                this.showHint(`已删除 ${deletedCount} 个节点`);
                if (window.propPanel) window.propPanel.clear();
            }

            editNode() {
                if (!this.selectedNodeId) { this.showHint('请先选择一个节点'); return; }
                const result = this.findNode(this.selectedNodeId);
                if (!result) return;

                this._cancelEditing();

                const pos = this.layoutMap.get(this.selectedNodeId);
                if (!pos) { requestAnimationFrame(() => this.editNode()); return; }

                const nodeId = this.selectedNodeId;
                const node = result.node;
                const isRoot = !result.parent;

                const editor = document.createElement('div');
                editor.className = 'node-inline-editor';
                editor.contentEditable = 'true';
                editor.spellcheck = false;
                editor.textContent = node.text;

                const applyPos = (p) => {
                    editor.style.left = p.x + 'px';
                    editor.style.top = (p.y - p.height / 2) + 'px';
                    editor.style.width = p.width + 'px';
                    editor.style.height = p.height + 'px';
                    editor.style.fontSize = (14 * this.scale) + 'px';
                    editor.style.background = isRoot ? '#409eff' : '#ffffff';
                    editor.style.color = isRoot ? '#ffffff' : '#303133';
                    editor.style.caretColor = isRoot ? '#ffffff' : '#303133';
                    editor.style.border = isRoot ? '1px solid #409eff' : '1px solid #dcdfe6';
                    editor.style.borderRadius = '6px';
                };
                applyPos(pos);

                this.container.appendChild(editor);
                this._editorEl = editor;

                editor.focus();
                try {
                    const range = document.createRange();
                    range.selectNodeContents(editor);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                } catch (e) {}

                let dirty = false;
                editor.addEventListener('input', () => { dirty = true; });

                let syncRaf = null;
                const syncPos = () => {
                    if (!document.body.contains(editor)) return;
                    const p = this.layoutMap.get(nodeId);
                    if (p) applyPos(p);
                    syncRaf = requestAnimationFrame(syncPos);
                };
                syncRaf = requestAnimationFrame(syncPos);

                let finished = false;
                const commit = (save) => {
                    if (finished) return;
                    finished = true;
                    if (syncRaf) cancelAnimationFrame(syncRaf);
                    const el = this._editorEl;
                    this._editorEl = null;

                    const newText = el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : '';
                    if (el) el.remove();

                    if (save && dirty && newText && newText !== node.text) {
                        node.text = newText;
                        this.saveHistory();
                        this.render();
                        window.mindmapManager.saveCurrentData();
                        if (window.propPanel && window.propPanel.currentNodeId === nodeId) {
                            window.propPanel.showNode(nodeId, { skipLoadNotes: true });
                        }
                    }
                };

                editor.addEventListener('blur', () => setTimeout(() => commit(true), 0));

                editor.addEventListener('keydown', (e) => {
                    e.stopPropagation();
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        commit(true);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        commit(false);
                    }
                });

                editor.addEventListener('mousedown', (e) => e.stopPropagation());
                editor.addEventListener('click', (e) => e.stopPropagation());
                editor.addEventListener('dblclick', (e) => e.stopPropagation());
            }

            _cancelEditing() {
                if (this._editorEl) {
                    this._editorEl.remove();
                    this._editorEl = null;
                }
            }

            showHint(msg) {
                this.addHint.textContent = msg;
                this.addHint.classList.add('show');
                setTimeout(() => this.addHint.classList.remove('show'), 2000);
            }

            hideContextMenu() { this.contextMenu.classList.remove('show'); }

            initEvents() {
                this.svg.addEventListener('wheel', (e) => {
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        if (!window.zoomControls) return;
                        const oldScale = window.zoomControls.scale;
                        const delta = e.deltaY > 0 ? -0.1 : 0.1;
                        const newScale = Math.max(window.zoomControls.minScale, Math.min(window.zoomControls.maxScale, oldScale + delta));
                        if (newScale === oldScale) return;

                        const rect = this.container.getBoundingClientRect();
                        const mx = e.clientX - rect.left;
                        const my = e.clientY - rect.top;

                        const oldOrigin = this._getOrigin(oldScale, this.offsetX, this.offsetY);
                        const lx = (mx - oldOrigin.x) / oldScale;
                        const ly = (my - oldOrigin.y) / oldScale;

                        const lw = this._rootWidth || this.config.nodeWidth;
                        this.offsetX = mx - lx * newScale - rect.width / 2 + (lw * newScale) / 2;
                        this.offsetY = my - ly * newScale - rect.height / 2;

                        window.zoomControls.setScale(newScale);
                    } else { e.preventDefault(); }
                }, { passive: false });

                this._lastClickNodeId = null;
                this._lastClickTime = 0;
                this._doubleClickDelay = 500;

                this.svg.addEventListener('mousedown', (e) => {
                    if (this._editorEl && this._editorEl.contains(e.target)) return;

                    const target = e.target.closest('.node-rect');
                    if (target) {
                        const nodeId = target.getAttribute('data-node-id');
                        if (nodeId) {
                            const now = Date.now();
                            const isDouble = (this._lastClickNodeId === nodeId && (now - this._lastClickTime) < this._doubleClickDelay);
                            this._lastClickNodeId = nodeId;
                            this._lastClickTime = now;

                            this.selectNode(nodeId, e.ctrlKey || e.metaKey);
                            e.stopPropagation();
                            e.preventDefault();

                            if (isDouble) {
                                this._lastClickNodeId = null;
                                this._lastClickTime = 0;
                                setTimeout(() => this.editNode(), 0);
                            }
                            return;
                        }
                    }

                    this._lastClickNodeId = null;
                    this._lastClickTime = 0;

                    if (!e.ctrlKey && !e.metaKey) this.deselectNode();
                    this.isDragging = true;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    this.svg.style.cursor = 'grabbing';
                    this.hideContextMenu();
                });

                window.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;
                    const dx = e.clientX - this.lastMouseX;
                    const dy = e.clientY - this.lastMouseY;
                    this.offsetX += dx;
                    this.offsetY += dy;
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    if (!this._rafPending) {
                        this._rafPending = true;
                        requestAnimationFrame(() => {
                            this._rafPending = false;
                            this.render();
                        });
                    }
                });

                window.addEventListener('mouseup', () => { this.isDragging = false; this.svg.style.cursor = 'grab'; });

                this.svg.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    const target = e.target.closest('.node-rect');
                    if (!target) return;
                    const nodeId = target.getAttribute('data-node-id');
                    if (nodeId) this.selectNode(nodeId, e.ctrlKey || e.metaKey);
                    this.contextMenu.style.left = e.clientX + 'px';
                    this.contextMenu.style.top = e.clientY + 'px';
                    this.contextMenu.classList.add('show');
                });

                document.addEventListener('click', (e) => {
                    if (!this.contextMenu.contains(e.target)) this.hideContextMenu();
                });

                document.addEventListener('keydown', (e) => {
                    if (window.mindmap && window.mindmap._editorEl) return;

                    const target = e.target;
                    if (target && target.closest) {
                        if (target.closest('.prop-panel') || target.closest('.sidebar') || target.closest('.modal-overlay') || target.closest('.export-menu') || target.closest('.color-picker')) {
                            return;
                        }
                        const tagName = target.tagName ? target.tagName.toLowerCase() : '';
                        if (tagName === 'input' || tagName === 'textarea' || target.isContentEditable) return;
                    }

                    const activeEl = document.activeElement;
                    if (activeEl) {
                        const tagName = activeEl.tagName ? activeEl.tagName.toLowerCase() : '';
                        const isInput = tagName === 'input' || tagName === 'textarea';
                        const isContentEditable = activeEl.isContentEditable;
                        const isInPropPanel = activeEl.closest && activeEl.closest('.prop-panel') !== null;
                        const isInSidebar = activeEl.closest && activeEl.closest('.sidebar') !== null;
                        if (isInput || isContentEditable || isInPropPanel || isInSidebar) return;
                    }
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); this.undo(); return; }
                    if (e.key === 'Tab') { e.preventDefault(); this.addChildNode(); }
                    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.addSiblingNode(); }
                    if (e.key === 'Delete' || e.key === 'Backspace') {
                        if (this.selectedNodeId || this.selectedNodeIds.size > 0) { e.preventDefault(); this.deleteNode(); }
                    }
                    if (e.key === 'Escape') { this.deselectNode(); this.hideContextMenu(); }
                });
            }
        }

        // ==================== ★ 初始化（等 pywebview 就绪） ====================
        let _appInited = false;
        async function initApp() {
            if (_appInited) return;
            _appInited = true;
            console.log('🚀 开始初始化应用，pywebview 可用:', !!(window.pywebview && window.pywebview.api));
            window.mindmapManager = new MindmapManager();
            window.mindmap = new MindMap();
            window.propPanel = new PropPanel();
            window.zoomControls = new ZoomControls();
            await window.mindmapManager.init();
            try { eggCheck(); } catch (e) { console.warn('彩蛋检查异常', e); }
        }

        // 事件绑定（不依赖 pywebview）
        document.getElementById('undoBtn').addEventListener('click', () => { if (window.mindmap) window.mindmap.undo(); });

        const exportMenu = document.getElementById('exportMenu');

        document.getElementById('exportMindmapHeaderBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = e.currentTarget.getBoundingClientRect();
            exportMenu.style.left = rect.left + 'px';
            exportMenu.style.top = (rect.bottom + 6) + 'px';
            exportMenu.classList.add('show');
        });

        document.addEventListener('click', (e) => {
            if (!exportMenu.contains(e.target)) exportMenu.classList.remove('show');
        });

        exportMenu.querySelectorAll('.export-menu-item').forEach(item => {
            item.addEventListener('click', () => {
                exportMenu.classList.remove('show');
                const fmt = item.dataset.format;
                if (fmt === 'json') exportAsJSON();
                else if (fmt === 'svg') exportAsSVG();
            });
        });

        async function exportAsJSON() {
            const mm = window.mindmapManager.getCurrentMindmap();
            if (!mm) { window.mindmap.showHint('没有可导出的导图'); return; }

            window.mindmapManager.saveCurrentData();
            if (window.propPanel) {
                window.propPanel.commitPendingHistorySave();
                window.propPanel.flushPersist();
            }

            const payload = { id: mm.id, name: mm.name, color: mm.color || DEFAULT_COLOR, data: mm.data };
            const json = JSON.stringify(payload, null, 2);
            const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
            const safeName = (mm.name || '思维导图').replace(/[\\/:*?"<>|]/g, '_');
            const defaultName = safeName + '.json';

            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: defaultName,
                        types: [{ description: 'JSON 文件', accept: { 'application/json': ['.json'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    window.mindmap.showHint('✅ JSON 已导出');
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return;  // 用户主动取消
                    console.warn('文件选择器不可用，改用浏览器下载', err);
                }
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = defaultName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
            window.mindmap.showHint('✅ JSON 已导出');
        }

        async function exportAsSVG() {
            try {
                const svg = document.getElementById('mindmap-canvas');
                const serializer = new XMLSerializer();
                const svgString = serializer.serializeToString(svg);
                const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                const mmName = window.mindmapManager.getCurrentMindmap()?.name || '思维导图';
                const safeName = mmName.replace(/[\\/:*?"<>|]/g, '_');
                const defaultName = safeName + '.svg';

                if (window.showSaveFilePicker) {
                    try {
                        const handle = await window.showSaveFilePicker({
                            suggestedName: defaultName,
                            types: [{ description: 'SVG 图像', accept: { 'image/svg+xml': ['.svg'] } }]
                        });
                        const writable = await handle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        window.mindmap.showHint('✅ 图片已导出');
                        return;
                    } catch (err) {
                        if (err && err.name === 'AbortError') return;
                        console.warn('文件选择器不可用，改用浏览器下载', err);
                    }
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = defaultName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
                window.mindmap.showHint('✅ 图片已导出（浏览器下载）');
            } catch (err) {
                console.error(err);
                window.mindmap.showHint('❌ 导出失败：' + err.message);
            }
        }

        const importMindmapInput = document.getElementById('importMindmapInput');
        importMindmapInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                let data;
                try {
                    data = JSON.parse(event.target.result);
                } catch (err) {
                    window.mindmap.showHint('❌ 导入失败：JSON 解析错误');
                    e.target.value = '';
                    return;
                }
                const result = window.mindmapManager.addImportedMindmap(data);
                if (result.success) {
                    window.mindmap.showHint('✅ 导入成功：' + result.mindmap.name);
                } else {
                    window.mindmap.showHint('❌ 导入失败：' + (result.reason || '未知错误'));
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        });

        document.getElementById('importMindmapHeaderBtn').addEventListener('click', () => {
            importMindmapInput.value = '';
            importMindmapInput.click();
        });

        const searchInput = document.getElementById('mindmapSearchInput');
        const searchClear = document.getElementById('mindmapSearchClear');

        searchInput.addEventListener('input', (e) => {
            if (window.mindmapManager) window.mindmapManager.searchKeyword = e.target.value.trim();
            searchClear.classList.toggle('visible', !!(e.target.value.trim()));
            if (window.mindmapManager) window.mindmapManager.renderList();
        });

        searchInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') {
                e.preventDefault();
                searchInput.value = '';
                if (window.mindmapManager) window.mindmapManager.searchKeyword = '';
                searchClear.classList.remove('visible');
                if (window.mindmapManager) window.mindmapManager.renderList();
            }
        });

        searchClear.addEventListener('click', (e) => {
            e.stopPropagation();
            searchInput.value = '';
            if (window.mindmapManager) window.mindmapManager.searchKeyword = '';
            searchClear.classList.remove('visible');
            if (window.mindmapManager) window.mindmapManager.renderList();
            searchInput.focus();
        });

        const colorPickerEl = document.getElementById('colorPicker');
        let colorPickerTargetId = null;

        function buildColorPicker() {
            colorPickerEl.innerHTML = COLOR_OPTIONS.map(c =>
                `<div class="color-swatch" data-color="${c}" style="background:${c}"></div>`
            ).join('');
        }
        buildColorPicker();

        colorPickerEl.addEventListener('click', (e) => {
            e.stopPropagation();
            const swatch = e.target.closest('.color-swatch');
            if (!swatch || !colorPickerTargetId) return;
            const color = swatch.dataset.color;
            window.mindmapManager.setMindmapColor(colorPickerTargetId, color);
            closeColorPicker();
        });

        function openColorPicker(mindmapId, dotEl) {
            colorPickerTargetId = mindmapId;
            const mm = window.mindmapManager.mindmaps.find(m => m.id === mindmapId);
            const currentColor = (mm && mm.color) || DEFAULT_COLOR;

            colorPickerEl.querySelectorAll('.color-swatch').forEach(s => {
                s.classList.toggle('selected', s.dataset.color === currentColor);
            });

            colorPickerEl.style.visibility = 'hidden';
            colorPickerEl.classList.add('show');

            const pickerRect = colorPickerEl.getBoundingClientRect();
            const dotRect = dotEl.getBoundingClientRect();

            let left = dotRect.left;
            let top = dotRect.bottom + 6;

            if (left + pickerRect.width > window.innerWidth - 8) {
                left = window.innerWidth - pickerRect.width - 8;
            }
            if (left < 8) left = 8;
            if (top + pickerRect.height > window.innerHeight - 8) {
                top = dotRect.top - pickerRect.height - 6;
            }
            if (top < 8) top = 8;

            colorPickerEl.style.left = left + 'px';
            colorPickerEl.style.top = top + 'px';
            colorPickerEl.style.visibility = '';
        }

        function closeColorPicker() {
            colorPickerEl.classList.remove('show');
            colorPickerTargetId = null;
        }

        document.addEventListener('click', (e) => {
            if (!colorPickerEl.contains(e.target)) closeColorPicker();
        });
        window.addEventListener('resize', closeColorPicker);

        const newMindmapModal = document.getElementById('newMindmapModal');
        const newMindmapNameInput = document.getElementById('newMindmapName');
        const newMindmapErrorEl = document.getElementById('newMindmapError');

        function openNewMindmapModal() {
            newMindmapNameInput.value = '';
            newMindmapNameInput.classList.remove('error');
            newMindmapErrorEl.textContent = '';
            newMindmapModal.classList.add('show');
            setTimeout(() => newMindmapNameInput.focus(), 50);
        }

        function closeNewMindmapModal() {
            newMindmapModal.classList.remove('show');
        }

        function confirmNewMindmap() {
            const name = newMindmapNameInput.value.trim();

            if (!name) {
                newMindmapNameInput.classList.add('error');
                newMindmapErrorEl.textContent = '请输入导图名称';
                newMindmapNameInput.focus();
                return;
            }

            if (name.length > 50) {
                newMindmapNameInput.classList.add('error');
                newMindmapErrorEl.textContent = '名称不能超过 50 个字符';
                newMindmapNameInput.focus();
                return;
            }

            if (window.mindmapManager && window.mindmapManager.isNameExists(name)) {
                newMindmapNameInput.classList.add('error');
                newMindmapErrorEl.textContent = '该名称已存在，请换一个';
                newMindmapNameInput.focus();
                newMindmapNameInput.select();
                return;
            }

            closeNewMindmapModal();
            window.mindmapManager.createMindmap(name);
        }

        newMindmapNameInput.addEventListener('input', () => {
            if (newMindmapNameInput.classList.contains('error')) {
                newMindmapNameInput.classList.remove('error');
                newMindmapErrorEl.textContent = '';
            }
        });

        newMindmapNameInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmNewMindmap();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeNewMindmapModal();
            }
        });

        newMindmapModal.addEventListener('mousedown', (e) => {
            if (e.target === newMindmapModal) closeNewMindmapModal();
        });

        document.getElementById('addMindmapBtn').addEventListener('click', openNewMindmapModal);

        const deleteMindmapModal = document.getElementById('deleteMindmapModal');
        const deleteMindmapTargetName = document.getElementById('deleteMindmapTargetName');
        let pendingDeleteMindmapId = null;

        function openDeleteMindmapModal(id, name) {
            pendingDeleteMindmapId = id;
            deleteMindmapTargetName.textContent = name || '未命名导图';
            deleteMindmapModal.classList.add('show');
        }

        function closeDeleteMindmapModal() {
            deleteMindmapModal.classList.remove('show');
            pendingDeleteMindmapId = null;
        }

        function confirmDeleteMindmap() {
            if (pendingDeleteMindmapId) {
                const id = pendingDeleteMindmapId;
                pendingDeleteMindmapId = null;
                deleteMindmapModal.classList.remove('show');
                window.mindmapManager.performDeleteMindmap(id);
            }
        }

        deleteMindmapModal.addEventListener('mousedown', (e) => {
            if (e.target === deleteMindmapModal) closeDeleteMindmapModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && deleteMindmapModal.classList.contains('show')) {
                e.preventDefault();
                closeDeleteMindmapModal();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (!window.mindmapManager || window.mindmapManager.mindmaps.length === 0) return;
            if (window.mindmap) window.mindmap._cancelEditing();
            if (window.propPanel) {
                window.propPanel.commitPendingHistorySave();
                window.propPanel.flushPersist();
            }
        });

        // ============ 启动：等 pywebview 就绪 ============
        if (window.pywebview && window.pywebview.api) {
            // 已经注入（罕见）
            initApp();
        } else {
            // 等 pywebviewready 事件（官方推荐）
            window.addEventListener('pywebviewready', () => {
                console.log('📡 pywebviewready 事件触发');
                initApp();
            });
            // 兜底：2 秒后强制初始化（浏览器场景走 fetch）
            setTimeout(() => {
                if (!_appInited) {
                    console.log('⏱️ 2 秒超时，强制初始化（可能是浏览器环境）');
                    initApp();
                }
            }, 2000);
        }
    </script>
<script>
    /* header 高度自适应同步：窗口变窄 header 换行时，内容区不会被遮挡 */
    (function () {
        function syncHeaderHeight() {
            try {
                var hd = document.querySelector('.header');
                var lc = document.querySelector('.layout-container');
                if (!hd || !lc) return;
                var h = Math.round(hd.getBoundingClientRect().height);
                lc.style.paddingTop = h + 'px';
                // layout-container 是 border-box：height 含 padding，
                // 所以这里给满屏高，内容区自然等于 innerHeight - header 高度；
                // 之前写成 innerHeight - h，等于把 header 高度扣了两次，底部会空出一截
                lc.style.height = window.innerHeight + 'px';
                var ct = document.querySelector('.current-title');
                if (ct) ct.style.top = (h + 12) + 'px';
            } catch (e) { }
        }
        window.addEventListener('resize', syncHeaderHeight);
        window.addEventListener('orientationchange', syncHeaderHeight);
        document.addEventListener('DOMContentLoaded', syncHeaderHeight);
        setTimeout(syncHeaderHeight, 200);
        setTimeout(syncHeaderHeight, 800);
        setTimeout(syncHeaderHeight, 2500);
    })();
</script>
